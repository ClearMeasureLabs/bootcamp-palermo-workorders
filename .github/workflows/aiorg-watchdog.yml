# aiorg v0 piece 5: every 15 minutes, find stalled aiorg lanes and label them aiorg:stalled.
name: aiorg-watchdog
on:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  actions: read
concurrency:
  group: aiorg-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    if: vars.AIORG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIORG_HOME: ${{ github.workspace }}/aiorg
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "430cfaee11de1717188701f1d068d700f9b1e77c"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: aiorg
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: aiorg
        run: dotnet build src/Aiorg.Cli -c Release -o ../aiorg-bin --nologo -v quiet
      - name: Detect stalled lanes, label and explain each once
        run: dotnet aiorg-bin/aiorg.dll watchdog --repo "$REPO" --apply
