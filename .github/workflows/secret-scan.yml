# No secret in the repository: gitleaks over the history of every pull request and every push to master.
# The command-line tool, not gitleaks-action, which needs a license for organization repositories.
# The scan covers the commits of the checked-out ref (--log-opts=HEAD), not every branch of the repository, so a
# finding on an unmerged branch fails that branch only. Findings that are not secrets are listed by fingerprint in
# .gitleaksignore; .gitleaks.toml keeps the default rules.
name: secret-scan

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1 --log-opts="HEAD"
