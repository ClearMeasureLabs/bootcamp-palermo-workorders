# aiorg oracle wall: a PR may not delete, skip or weaken tests to go green.
# Posts the check run aiorg/test-diff (the config verifies via the Checks API); make it a required
# check in branch protection. Every 15 minutes it also re-runs the guard on PR heads that still carry
# the kill-switch placeholder, so switching aiorg back on never leaves an unguarded pass behind.
# pull_request_target runs this file from the base branch, so a PR cannot edit or remove the guard
# that judges it. The PR's commits are fetched as git objects and diffed; nothing from the PR runs.
name: aiorg-guards
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  checks: write
  pull-requests: read
concurrency:
  group: aiorg-pr-${{ github.event.pull_request.number }}-guards
  cancel-in-progress: true
jobs:
  test-diff:
    if: vars.AIORG_ENABLED == 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIORG_HOME: ${{ github.workspace }}/.aiorg-cli
      REPO: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "c47ac8d919ca38ffcdf2d58a6b670da3ce8d19e1"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: .aiorg-cli
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: .aiorg-cli
        run: dotnet build src/Aiorg.Cli -c Release -o ../.aiorg-cli-bin --nologo -v quiet
      - name: Guard test diff (fetches the PR as data, posts aiorg/test-diff)
        run: >-
          dotnet .aiorg-cli-bin/aiorg.dll guard test-diff --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR_NUMBER"
          --post-check --repo "$REPO" --target-url "$RUN_URL" --json
  test-diff-off:
    # Kill switch on (AIORG_ENABLED is not true): nothing runs, but a required aiorg/test-diff must not
    # block every merge, so this posts a neutral check that says the guard did not run. The revalidate
    # job re-runs the guard on these heads once aiorg is back on.
    if: vars.AIORG_ENABLED != 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIORG_HOME: ${{ github.workspace }}/.aiorg-cli
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "c47ac8d919ca38ffcdf2d58a6b670da3ce8d19e1"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: .aiorg-cli
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: .aiorg-cli
        run: dotnet build src/Aiorg.Cli -c Release -o ../.aiorg-cli-bin --nologo -v quiet
      - name: Post the kill-switch aiorg/test-diff check (neutral, guard not run)
        run: dotnet .aiorg-cli-bin/aiorg.dll guard test-diff --base "$BASE_SHA" --head "$HEAD_SHA" --disabled --post-check --repo "$REPO"
  revalidate:
    if: vars.AIORG_ENABLED == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIORG_HOME: ${{ github.workspace }}/.aiorg-cli
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "c47ac8d919ca38ffcdf2d58a6b670da3ce8d19e1"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: .aiorg-cli
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: .aiorg-cli
        run: dotnet build src/Aiorg.Cli -c Release -o ../.aiorg-cli-bin --nologo -v quiet
      - name: Re-run the guard where the kill-switch placeholder remains
        run: dotnet .aiorg-cli-bin/aiorg.dll guard revalidate --repo "$REPO" --target-url "$RUN_URL"
