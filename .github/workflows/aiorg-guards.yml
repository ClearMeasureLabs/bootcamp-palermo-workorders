# aiorg oracle wall: a PR may not delete, skip or weaken tests to go green.
# Posts the check run aiorg/test-diff (the config verifies via the Checks API); make it a required
# check in branch protection. Every 15 minutes it also runs the guard on open PR heads that have no
# aiorg/test-diff yet or still carry the kill-switch placeholder, so neither attaching nor switching
# aiorg back on leaves a PR blocked or passed unguarded.
# pull_request_target runs this file from the base branch, so a PR cannot edit or remove the guard
# that judges it; only PRs into the default branch are judged, so a PR into another branch cannot bring
# its own copy. The PR's commits are fetched as git objects and diffed; nothing from the PR runs.
name: aiorg-guards
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  checks: write
  pull-requests: read
concurrency:
  # One group per PR (a new push cancels the stale run); scheduled revalidation queues, never cancels.
  group: ${{ github.event_name == 'schedule' && 'aiorg-guards-revalidate' || format('aiorg-pr-{0}-guards', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  test-diff:
    if: vars.AIORG_ENABLED == 'true' && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIORG_HOME: ${{ github.workspace }}/.aiorg-cli
      REPO: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "1c7bfb15e8313920f65ea6fd79ab13161baeecce"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: .aiorg-cli
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: .aiorg-cli
        run: dotnet build src/Aiorg.Cli -c Release -o ../.aiorg-cli-bin --nologo -v quiet
      - name: Guard test diff (fetches the PR as data, posts aiorg/test-diff)
        run: >-
          dotnet .aiorg-cli-bin/aiorg.dll guard test-diff --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR_NUMBER"
          --post-check --repo "$REPO" --target-url "$RUN_URL" --json
  test-diff-off:
    # Kill switch on (AIORG_ENABLED is not true): nothing runs, but a required aiorg/test-diff must not
    # block every merge. This job's own check run is named aiorg/test-diff and passes without checking
    # out the control plane, so it depends on no token. The revalidate job runs the real guard on these
    # heads once aiorg is back on.
    name: aiorg/test-diff
    if: vars.AIORG_ENABLED != 'true' && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard not run (aiorg is off)
        run: dotnet --version
  revalidate:
    if: vars.AIORG_ENABLED == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIORG_HOME: ${{ github.workspace }}/.aiorg-cli
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "1c7bfb15e8313920f65ea6fd79ab13161baeecce"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: .aiorg-cli
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: .aiorg-cli
        run: dotnet build src/Aiorg.Cli -c Release -o ../.aiorg-cli-bin --nologo -v quiet
      - name: Run the guard where aiorg/test-diff is missing or is the kill-switch placeholder
        run: dotnet .aiorg-cli-bin/aiorg.dll guard revalidate --repo "$REPO" --target-url "$RUN_URL"
