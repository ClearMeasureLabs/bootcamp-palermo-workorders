# aiorg v0 piece 4: when CI fails on an aiorg/* branch, post a request for the CI fixer on the PR.
# Capped at 3 requests per PR; after that the PR is labeled aiorg:needs-owner instead.
name: aiorg-ci-fix
on:
  check_suite:
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: aiorg-ci-fix-${{ github.event.check_suite.head_sha }}
  cancel-in-progress: false
jobs:
  request-fix:
    if: vars.AIORG_ENABLED == 'true' && github.event.check_suite.conclusion == 'failure' && startsWith(github.event.check_suite.head_branch, 'aiorg/') && github.event.check_suite.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AIORG_HOME: ${{ github.workspace }}/aiorg
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.check_suite.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.check_suite.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "c19ca4f33015256602fb19d01f83719186688d2c"
          # A read-only token for the aiorg repository when it is private; the default token when public.
          token: ${{ secrets.AIORG_READ_TOKEN || github.token }}
          path: aiorg
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: aiorg
        run: dotnet build src/Aiorg.Cli -c Release -o ../aiorg-bin --nologo -v quiet
      - name: Post CI-fix request (at most 3 per PR, then aiorg:needs-owner)
        run: dotnet aiorg-bin/aiorg.dll ci-fix request --repo "$REPO" --pr "$PR_NUMBER" --head "$HEAD_SHA" --cap 3
