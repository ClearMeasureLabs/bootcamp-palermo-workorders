name: Deploy
# VERSION-MARKER: the "2.4." prefix below is hardcoded for the same reason as build.yml's
# run-name — GitHub Actions' run-name expression context has no access to `env` or job
# outputs, only `github`/`inputs`/`vars`/`secrets`, so MAJOR_VERSION/MINOR_VERSION (defined
# in the workflow-level `env:` block below) cannot be referenced here. If those values
# change, update this literal to match.
run-name: "${{ inputs.release_number && format('{0} • Deploy', inputs.release_number) || format('2.4.{0} • Deploy • {1}', github.event.workflow_run.run_number, github.event.workflow_run.head_branch) }}"
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release version to deploy (must match an existing Integration Build version, e.g. 2.4.394)'
        required: true
        type: string
      force_skip_tdd:
        description: 'Force deploy to UAT/Prod without TDD (bypasses acceptance tests) — use only for emergency releases.'
        required: false
        type: boolean
        default: false
env:
  MAJOR_VERSION: 2
  MINOR_VERSION: 4

jobs:
  deploy-to-tdd:
    name: TDD
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      # All TDD deploys share one group (single environment), but only branch runs
      # can be cancelled. Master/main deploys are never cancelled -- they queue instead.
      group: deploy-to-tdd-serialized
      cancel-in-progress: ${{ github.event.workflow_run.head_branch != 'master' && github.event.workflow_run.head_branch != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      actions: read
    environment:
      name: TDD

    steps:
      - name: Report TDD status as pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $sha = "${{ github.event.workflow_run.head_sha }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/statuses/$sha" `
            -f state="pending" `
            -f target_url="$runUrl" `
            -f description="TDD deployment in progress" `
            -f context="Deploy to TDD"

      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Version
        shell: pwsh
        run: |
          $version = "${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.event.workflow_run.run_number }}"
          "BUILD_BUILDNUMBER=$version" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Build version: $version"

      - name: Create Octopus Release
        id: create-octopus-release
        uses: OctopusDeploy/create-release-action@v3
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_BUILDNUMBER: ${{ env.VERSION }}
        with:
          project: '${{ vars.OCTOPUS_PROJECT }}'
          release_number: "${{ env.VERSION }}"
          git_ref: ${{ github.event.workflow_run.head_branch }}
          git_commit: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Octopus Release to TDD
        id: start-deploy-to-tdd
        uses: OctopusDeploy/deploy-release-action@v3
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
          BUILD_BUILDNUMBER: ${{ env.VERSION }}
        with:
          project: ${{ vars.OCTOPUS_PROJECT }}
          release_number: ${{ env.VERSION }}
          environments: "TDD"

      # Download, extract, and install Playwright while Octopus deploys in the background.
      # These steps only need the build artifact, not the deployed app.
      - name: Download Acceptance Test Package
        uses: actions/download-artifact@v4
        with:
          name: churchbulletin-nuget-packages
          path: ./packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract Acceptance Test Package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ./packages -Filter "ChurchBulletin.AcceptanceTests.*.nupkg" | Select-Object -First 1
          if (-not $package) {
            Write-Error "ChurchBulletin.AcceptanceTests package not found"
            Get-ChildItem -Path ./packages
            exit 1
          }
          Write-Host "Extracting $($package.Name)..."
          Expand-Archive -Path $package.FullName -DestinationPath ./acceptance-tests -Force

          $testDll = Get-ChildItem -Path ./acceptance-tests -Filter "ClearMeasure.Bootcamp.AcceptanceTests.dll" -Recurse | Select-Object -First 1
          if (-not $testDll) {
            Write-Error "ClearMeasure.Bootcamp.AcceptanceTests.dll not found in extracted package"
            exit 1
          }
          Write-Host "Test DLL found at: $($testDll.FullName)"
          "TEST_DIR=$($testDll.DirectoryName)" >> $env:GITHUB_ENV
          "TEST_DLL=$($testDll.FullName)" >> $env:GITHUB_ENV

          # Fix execute permissions for Playwright binaries extracted from Windows-built nupkg
          if ($IsLinux) {
            chmod -R +x ./acceptance-tests/.playwright/ 2>$null
            Write-Host "Fixed execute permissions on .playwright/ directory"
          }

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Include runner.arch so x64 Deploy does not restore ARM64 browsers via
          # restore-keys (build.yml keys are playwright-Linux-ARM64-*/X64-*).
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/AcceptanceTests/AcceptanceTests.csproj') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $playwrightScript = Join-Path $env:TEST_DIR "playwright.ps1"
          if (Test-Path $playwrightScript) {
            Write-Host "Installing Playwright browsers from $playwrightScript"
            & pwsh $playwrightScript install --with-deps
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Playwright browsers"
            }
          } else {
            Write-Warning "Playwright script not found at $playwrightScript"
          }

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $playwrightScript = Join-Path $env:TEST_DIR "playwright.ps1"
          if (Test-Path $playwrightScript) {
            Write-Host "Installing Playwright OS dependencies (browsers cached)"
            & pwsh $playwrightScript install-deps
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Playwright dependencies"
            }
          }

      # Now wait for the Octopus deployment that has been running in parallel
      - name: Wait for the TDD deployment to complete
        uses: OctopusDeploy/await-task-action@v3
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY  }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
        with:
          server_task_id: ${{ fromJson(steps.start-deploy-to-tdd.outputs.server_tasks)[0].serverTaskId }}
          timeout_after: 1800

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Container App FQDN and Connection String
        shell: pwsh
        run: |
          # Single az call to retrieve both FQDN and connection string
          $appJson = az containerapp show `
            --name ${{ vars.CONTAINER_APP_NAME }} `
            --resource-group ${{ vars.TDD_RESOURCE_GROUP_NAME}} `
            --query "{fqdn: properties.configuration.ingress.fqdn, connStr: properties.template.containers[0].env[?name=='ConnectionStrings__SqlConnectionString'].value | [0]}" `
            -o json | ConvertFrom-Json

          $containerAppFqdn = $appJson.fqdn
          if ([string]::IsNullOrWhiteSpace($containerAppFqdn)) {
            Write-Error "Error: Could not retrieve container app FQDN"
            exit 1
          }

          $containerAppUrl = "https://$containerAppFqdn"
          Write-Host "Container App FQDN: $containerAppFqdn"
          Write-Host "Container App URL: $containerAppUrl"
          "CONTAINER_APP_URL=$containerAppUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ApplicationBaseUrl=$containerAppUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $containerAppConnectionString = $appJson.connStr
          Write-Host "Container App Connection String retrieved: $(-not [string]::IsNullOrWhiteSpace($containerAppConnectionString))"
          if (-not [string]::IsNullOrWhiteSpace($containerAppConnectionString)) {
            Write-Host "::add-mask::$containerAppConnectionString"
          }
          "ConnectionStrings__SqlConnectionString=$containerAppConnectionString" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CONTAINER_APP_CONNECTION_STRING=$containerAppConnectionString" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Degraded health status gating policy (see #9017, decision recorded on that issue):
      # - TDD (this job) hard-fails on Degraded. TDD gates the Playwright acceptance-test run
      #   immediately below and has full app configuration wired, so Degraded here means
      #   something is actually broken, not a known/expected config gap.
      # - UAT/Prod (below) stay non-blocking on Degraded for now because they are currently
      #   Degraded solely due to the known, separately-tracked LlmGateway AI_OpenAI_* config
      #   gap in #9016. Once #9016 closes that gap, tightening UAT/Prod to hard-fail on
      #   Degraded (matching TDD) should be filed as a fast-follow.
      - name: Wait for Container App to become healthy
        shell: pwsh
        run: |
          $url = "${{ env.CONTAINER_APP_URL }}/_healthcheck"
          $maxAttempts = 30
          $delaySeconds = 5
          Write-Host "Polling $url for healthy response (max ${maxAttempts} attempts, ${delaySeconds}s apart)..."
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              $body = $response.Content
              Write-Host "Attempt ${i}: HTTP $($response.StatusCode) - $body"
              if ($response.StatusCode -eq 200 -and $body -match 'Healthy') {
                Write-Host "Container App is healthy after $i attempts."
                exit 0
              }
              if ($response.StatusCode -eq 200 -and $body -match 'Degraded') {
                Write-Host "::warning::Container App returned Degraded health status after $i attempts."
                Write-Host "--- Degraded Health Check Diagnostics ---"
                Write-Host "Health check response body: $body"
                Write-Host "Health check HTTP status: $($response.StatusCode)"
                Write-Host "Health check headers:"
                $response.Headers.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                Write-Host "Timestamp: $(Get-Date -Format o)"
                Write-Host "--- End Diagnostics ---"
                Write-Error "Container App returned Degraded health status; treating as failure (TDD gates acceptance tests and has full config, see #9017)."
                exit 1
              }
            } catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            if ($i -lt $maxAttempts) { Start-Sleep -Seconds $delaySeconds }
          }
          Write-Error "Container App did not become healthy after $maxAttempts attempts."
          exit 1

      - name: Run Acceptance tests
        if: success()
        shell: pwsh
        env:
          ConnectionStrings__SqlConnectionString: ${{ env.CONTAINER_APP_CONNECTION_STRING }}
          ApplicationBaseUrl: ${{ env.CONTAINER_APP_URL }}
          StartLocalServer: "false"
          TEST_INPUT_DELAY_MS: "200"
          AI_OpenAI_ApiKey: ${{ secrets.AI_OPENAI_APIKEY }}
          AI_OpenAI_Url: ${{ vars.AI_OPENAI_URL }}
          AI_OpenAI_Model: ${{ vars.AI_OPENAI_MODEL }}
        run: |
          $resultsDirectory = Join-Path (Resolve-Path .) "build/test/AcceptanceTests"
          New-Item -ItemType Directory -Path $resultsDirectory -Force | Out-Null
          $runSettingsPath = Join-Path (Resolve-Path .) "src/AcceptanceTests/AcceptanceTests.runsettings"

          Write-Host "Running acceptance tests against $env:ApplicationBaseUrl"
          Write-Host "Test DLL: $env:TEST_DLL"

          dotnet test $env:TEST_DLL --nologo --logger:trx `
            --results-directory $resultsDirectory `
            --settings $runSettingsPath


      - name: Upload Acceptance Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-results-tdd
          path: build/test/AcceptanceTests/**/*.trx
          retention-days: 2

      - name: Report TDD status to commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $sha = "${{ github.event.workflow_run.head_sha }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $jobStatus = "${{ job.status }}"

          if ($jobStatus -eq "cancelled") {
            Write-Host "Job was cancelled (superseded by a newer deployment). Leaving status as pending."
            exit 0
          }

          if ($jobStatus -eq "success") {
            $state = "success"
            $description = "TDD deployment and acceptance tests passed"
          } else {
            $state = "failure"
            $description = "TDD deployment or acceptance tests failed"
          }

          gh api "repos/${{ github.repository }}/statuses/$sha" `
            -f state="$state" `
            -f target_url="$runUrl" `
            -f description="$description" `
            -f context="Deploy to TDD"

  deploy-to-uat:
    name: UAT
    needs: [deploy-to-tdd]
    # Run UAT when:
    # 1. Manual workflow_dispatch with a release_number AND force_skip_tdd=true
    #    (explicit emergency-bypass opt-in; TDD is skipped), OR
    # 2. TDD succeeded on master/main from a push-triggered Integration Build
    # !cancelled() is required so the if condition is evaluated even when TDD is skipped
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (inputs.force_skip_tdd == true || inputs.force_skip_tdd == 'true')) ||
        (needs.deploy-to-tdd.result == 'success' &&
         github.event.workflow_run.event == 'push' &&
         (github.event.workflow_run.head_branch == 'master' ||
          github.event.workflow_run.head_branch == 'main'))
      )
    concurrency:
      # A newer version waiting for UAT approval will cancel any previous pending run.
      group: deploy-to-uat-serialized
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: UAT
    # Note: The UAT environment protection rule should allow any person to approve deployments.
    # Configure this in GitHub repo Settings > Environments > UAT > Required reviewers.

    steps:
      - name: Validate release_number format
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $releaseNumber = "${{ inputs.release_number }}"
          if ($releaseNumber -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid release_number '$releaseNumber'. Expected semver-ish format N.N.N (e.g. 2.4.394)."
            exit 1
          }
          Write-Host "release_number '$releaseNumber' is valid."

      - name: Set Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.release_number }}"
          else
            version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.event.workflow_run.run_number }}"
          fi
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "Deploy version: $version"

      - name: Deploy Octopus Release to UAT
        uses: OctopusDeploy/deploy-release-action@v3
        id: start-deploy-to-uat
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
        with:
          project: ${{ vars.OCTOPUS_PROJECT }}
          release_number: ${{ env.BUILD_BUILDNUMBER }}
          environments: "UAT"

      - name: Wait for the UAT deployment to complete
        uses: OctopusDeploy/await-task-action@v3
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY  }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
        with:
          server_task_id: ${{ fromJson(steps.start-deploy-to-uat.outputs.server_tasks)[0].serverTaskId }}
          timeout_after: 1800

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Octopus deploy is the release gate; Azure FQDN lookup is best-effort (SP may lack RG read).
      - name: Get Container App FQDN
        shell: pwsh
        continue-on-error: true
        run: |
          $appName = "${{ vars.CONTAINER_APP_NAME }}".Trim()
          $resourceGroup = "${{ vars.UAT_RESOURCE_GROUP_NAME }}".Trim()
          if ([string]::IsNullOrWhiteSpace($appName) -or [string]::IsNullOrWhiteSpace($resourceGroup)) {
            Write-Host "::warning::Skipping UAT Container App URL: CONTAINER_APP_NAME or UAT_RESOURCE_GROUP_NAME is empty."
            exit 0
          }
          $fqdn = az containerapp show `
            --name $appName `
            --resource-group $resourceGroup `
            --query "properties.configuration.ingress.fqdn" `
            -o tsv 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($fqdn) -or $fqdn -match 'ERROR') {
            Write-Host "::warning::Could not retrieve UAT container app FQDN (Octopus deploy already succeeded). Details: $fqdn"
            exit 0
          }
          $containerAppUrl = "https://$fqdn"
          Write-Host "Container App FQDN: $fqdn"
          Write-Host "Container App URL: $containerAppUrl"
          "CONTAINER_APP_URL=$containerAppUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Degraded health status is non-blocking here (see #9017): UAT is currently Degraded
      # solely due to the known, separately-tracked LlmGateway AI_OpenAI_* config gap in
      # #9016, so promotion stays green, but the status is surfaced loudly via ::warning::
      # and the job summary instead of being silently swallowed. Unreachable/non-200
      # handling below is untouched (may be governed by #9011). Once #9016 lands, tighten
      # this to hard-fail on Degraded, matching TDD, as a fast-follow.
      - name: Wait for Container App to become healthy
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ env.CONTAINER_APP_URL }}")) {
            Write-Host "::error::Container App URL could not be resolved (FQDN lookup failed or was skipped). Cannot verify deploy health."
            exit 1
          }
          $url = "${{ env.CONTAINER_APP_URL }}/_healthcheck"
          $maxAttempts = 12
          $delaySeconds = 5
          Write-Host "Polling $url for healthy response (max ${maxAttempts} attempts, ${delaySeconds}s apart)..."
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              $body = $response.Content
              Write-Host "Attempt ${i}: HTTP $($response.StatusCode) - $body"
              if ($response.StatusCode -eq 200 -and $body -match 'Healthy') {
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                exit 0
              }
              if ($response.StatusCode -eq 200 -and $body -match 'Degraded') {
                Write-Host "::warning::Container App returned Degraded health status after $i attempts."
                Write-Host "--- Degraded Health Check Diagnostics ---"
                Write-Host "Health check response body: $body"
                Write-Host "Health check HTTP status: $($response.StatusCode)"
                Write-Host "Health check headers:"
                $response.Headers.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                Write-Host "Timestamp: $(Get-Date -Format o)"
                Write-Host "--- End Diagnostics ---"
                "### :warning: UAT Container App is Degraded`n`nHealth check at ``$url`` returned HTTP 200 with a Degraded status after $i attempts. This is currently expected due to the LlmGateway AI_OpenAI_* config gap tracked in #9016 and is non-blocking for promotion. See job logs for full diagnostics.`n`n- Response body: ``$body```n- Timestamp: $(Get-Date -Format o)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                exit 0
              }
              if ($response.StatusCode -eq 200) {
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                exit 0
              }
            } catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            if ($i -lt $maxAttempts) { Start-Sleep -Seconds $delaySeconds }
          }
          Write-Host "::error::Container App health check did not succeed after $maxAttempts attempts."
          exit 1

  deploy-to-prod:
    name: Prod
    needs: [deploy-to-uat]
    # Do not use success() — skipped TDD on workflow_dispatch makes success() false
    # and skips Prod even when UAT succeeded.
    # Defense-in-depth: a workflow_dispatch run can only reach Prod when force_skip_tdd
    # was explicitly set (mirrors the deploy-to-uat gate above).
    if: >-
      !cancelled() && needs.deploy-to-uat.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.force_skip_tdd == true || inputs.force_skip_tdd == 'true')
    concurrency:
      group: deploy-to-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: Prod

    steps:
      - name: Set Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.release_number }}"
          else
            version="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ github.event.workflow_run.run_number }}"
          fi
          echo "BUILD_BUILDNUMBER=$version" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "Deploy version: $version"

      - name: Deploy Octopus Release to Prod
        uses: OctopusDeploy/deploy-release-action@v3
        id: start-deploy-to-prod
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
        with:
          project: ${{ vars.OCTOPUS_PROJECT }}
          release_number: ${{ env.BUILD_BUILDNUMBER }}
          environments: "Prod"

      - name: Wait for the Prod deployment to complete
        uses: OctopusDeploy/await-task-action@v3
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY  }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
        with:
          server_task_id: ${{ fromJson(steps.start-deploy-to-prod.outputs.server_tasks)[0].serverTaskId }}
          timeout_after: 1800

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Container App FQDN
        shell: pwsh
        continue-on-error: true
        run: |
          $appName = "${{ vars.CONTAINER_APP_NAME }}".Trim()
          $resourceGroup = "${{ vars.PROD_RESOURCE_GROUP_NAME }}".Trim()
          if ([string]::IsNullOrWhiteSpace($appName) -or [string]::IsNullOrWhiteSpace($resourceGroup)) {
            Write-Host "::warning::Skipping Prod Container App URL: CONTAINER_APP_NAME or PROD_RESOURCE_GROUP_NAME is empty."
            exit 0
          }
          $fqdn = az containerapp show `
            --name $appName `
            --resource-group $resourceGroup `
            --query "properties.configuration.ingress.fqdn" `
            -o tsv 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($fqdn) -or $fqdn -match 'ERROR') {
            Write-Host "::warning::Could not retrieve Prod container app FQDN (Octopus deploy already succeeded). Details: $fqdn"
            exit 0
          }
          $containerAppUrl = "https://$fqdn"
          Write-Host "Container App FQDN: $fqdn"
          Write-Host "Container App URL: $containerAppUrl"
          "CONTAINER_APP_URL=$containerAppUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Degraded health status is non-blocking here (see #9017): Prod is currently Degraded
      # solely due to the known, separately-tracked LlmGateway AI_OpenAI_* config gap in
      # #9016, so promotion stays green, but the status is surfaced loudly via ::warning::
      # and the job summary instead of being silently swallowed. Unreachable/non-200
      # handling below is untouched (may be governed by #9011). Once #9016 lands, tighten
      # this to hard-fail on Degraded, matching TDD, as a fast-follow.
      - name: Wait for Container App to become healthy
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ env.CONTAINER_APP_URL }}")) {
            Write-Host "::error::Container App URL could not be resolved (FQDN lookup failed or was skipped). Cannot verify deploy health."
            exit 1
          }
          $url = "${{ env.CONTAINER_APP_URL }}/_healthcheck"
          $maxAttempts = 12
          $delaySeconds = 5
          Write-Host "Polling $url for healthy response (max ${maxAttempts} attempts, ${delaySeconds}s apart)..."
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              $body = $response.Content
              Write-Host "Attempt ${i}: HTTP $($response.StatusCode) - $body"
              if ($response.StatusCode -eq 200 -and $body -match 'Healthy') {
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                exit 0
              }
              if ($response.StatusCode -eq 200 -and $body -match 'Degraded') {
                Write-Host "::warning::Container App returned Degraded health status after $i attempts."
                Write-Host "--- Degraded Health Check Diagnostics ---"
                Write-Host "Health check response body: $body"
                Write-Host "Health check HTTP status: $($response.StatusCode)"
                Write-Host "Health check headers:"
                $response.Headers.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                Write-Host "Timestamp: $(Get-Date -Format o)"
                Write-Host "--- End Diagnostics ---"
                "### :warning: Prod Container App is Degraded`n`nHealth check at ``$url`` returned HTTP 200 with a Degraded status after $i attempts. This is currently expected due to the LlmGateway AI_OpenAI_* config gap tracked in #9016 and is non-blocking for promotion. See job logs for full diagnostics.`n`n- Response body: ``$body```n- Timestamp: $(Get-Date -Format o)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                exit 0
              }
              if ($response.StatusCode -eq 200) {
                Write-Host "Container App URL: ${{ env.CONTAINER_APP_URL }}"
                exit 0
              }
            } catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            if ($i -lt $maxAttempts) { Start-Sleep -Seconds $delaySeconds }
          }
          Write-Host "::error::Container App health check did not succeed after $maxAttempts attempts."
          exit 1
