# Daily delivery scorecard for this repository.
#
# Installs the newest cmis build that ships a linux CLI asset. GitHub's Latest
# release of ClearMeasure/Clear-Measure-Intelligence-Scorecard is the Excel
# add-in installer and does not contain cmis. The CLI is the newest release,
# including delivery prereleases, whose assets include cmis-*-linux-x64.tar.gz.
#
# Harvests the last two calendar years MONTH BY MONTH (GitHubDelivery + board)
# into one workspace, then renders a single weekly scorecard (newest week left).
#
# Credentials: CMIS_<KEY>_TOKEN (hyphen becomes underscore).
# GitHubDelivery reads CMIS_<ID>_TOKEN and CMIS_<ID>_OCTOPUS_TOKEN.
name: Intelligence Scorecard

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  deployments: read

concurrency:
  group: intelligence-scorecard
  cancel-in-progress: true

jobs:
  scorecard:
    name: Delivery scorecard
    runs-on: ubuntu-latest
    # ~22 months with pauses/retries; fail loud before a six-hour silent hang.
    timeout-minutes: 360
    env:
      SCORECARD_REPO: ClearMeasure/Clear-Measure-Intelligence-Scorecard
      CMIS_GITHUB_TOKEN: ${{ secrets.CMIS_GITHUB_TOKEN }}
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
      GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
      OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTO_API_KEY }}
      OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
      OCTOPUS_PROJECT: ${{ vars.OCTOPUS_PROJECT }}
      CMIS_MONTH_TIMEOUT_SECS: "900"
      CMIS_MONTH_PAUSE_SECS: "45"
    steps:
      - name: Install cmis, harvest month-by-month, and publish the HTML scorecard
        timeout-minutes: 350
        run: |
          set -euo pipefail

          if [ -n "${CMIS_GITHUB_TOKEN}" ]; then
            harvest_token="${CMIS_GITHUB_TOKEN}"
            echo "GitHub token: CMIS_GITHUB_TOKEN"
          elif [ -n "${COPILOT_PAT}" ]; then
            harvest_token="${COPILOT_PAT}"
            echo "GitHub token: COPILOT_PAT (CMIS_GITHUB_TOKEN is not set)"
          else
            echo "::error::Need repository secret CMIS_GITHUB_TOKEN or COPILOT_PAT."
            exit 1
          fi
          if [ -z "${OCTOPUS_URL}" ] || [ -z "${OCTOPUS_API_KEY}" ]; then
            echo "::error::Octopus auth is missing. Repository secrets OCTOPUS_URL and OCTO_API_KEY are required."
            exit 1
          fi
          if [ -z "${OCTOPUS_SPACE}" ] || [ -z "${OCTOPUS_PROJECT}" ]; then
            echo "::error::Octopus target is missing. Repository variables OCTOPUS_SPACE and OCTOPUS_PROJECT are required."
            exit 1
          fi

          export GH_TOKEN="${harvest_token}"
          dest="${RUNNER_TEMP}/cmis-release"
          mkdir -p "${dest}"
          gh api --paginate "repos/${SCORECARD_REPO}/releases?per_page=100" \
            --jq '.[] | select(any(.assets[]; .name | test("linux-x64\\.tar\\.gz$"))) | {tag:.tag_name, assets:[.assets[].name]}' \
            > "${dest}/cmis-releases.jsonl"
          tag=$(jq -s -r '.[0].tag // empty' "${dest}/cmis-releases.jsonl")
          asset=$(jq -s -r '[.[0].assets[] | select(test("linux-x64\\.tar\\.gz$"))][0] // empty' "${dest}/cmis-releases.jsonl")
          if [ -z "${tag}" ] || [ -z "${asset}" ]; then
            echo "::error::No linux-x64 cmis asset on ${SCORECARD_REPO}."
            exit 1
          fi
          echo "Installing ${asset} from ${tag}"
          gh release download "${tag}" --repo "${SCORECARD_REPO}" \
            --pattern "${asset}" --pattern "SHA256SUMS.txt" \
            --dir "${dest}" --clobber
          if [ -f "${dest}/SHA256SUMS.txt" ] && grep -F -q "${asset}" "${dest}/SHA256SUMS.txt"; then
            grep -F "${asset}" "${dest}/SHA256SUMS.txt" | (cd "${dest}" && sha256sum -c -)
          else
            echo "::error::SHA256SUMS.txt does not list ${asset}. Refusing to run an unverified binary."
            exit 1
          fi
          mkdir -p "${dest}/tool"
          tar -xzf "${dest}/${asset}" -C "${dest}/tool"
          cmis="${dest}/tool/cmis"
          chmod +x "${cmis}"
          "${cmis}" --version

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          until=$(date -u +%F)
          since="$(date -u -d "$(date -u +%Y)-01-01 -1 year" +%F)"
          echo "Scorecard window: ${since} through ${until} (UTC)"

          workspace="${RUNNER_TEMP}/cmis-workspace"
          store="${RUNNER_TEMP}/cmis-store"
          mkdir -p "${workspace}" "${store}" "${GITHUB_WORKSPACE}/scorecard-report"
          report="${GITHUB_WORKSPACE}/scorecard-report/intelligence-scorecard.html"
          render_json="${RUNNER_TEMP}/scorecard-render.json"
          harvest_json="${RUNNER_TEMP}/harvest.json"
          months_status="${GITHUB_WORKSPACE}/scorecard-report/months-status.json"

          export CMIS_BOOTCAMP_TOKEN="${harvest_token}"
          export CMIS_BOOTCAMP_BOARD_TOKEN="${harvest_token}"
          export CMIS_BOOTCAMP_OCTOPUS_TOKEN="${OCTOPUS_API_KEY}"
          common=(--json --workspace "${workspace}" --store "${store}")

          cmis_ok() {
            local label="$1"
            shift
            local out="${RUNNER_TEMP}/cmis-last.json"
            echo "----- ${label} -----"
            if ! "${cmis}" "$@" > "${out}"; then
              echo "::error::${label} exited non-zero."
              cat "${out}" || true
              exit 1
            fi
            if [ "$(jq -r '.ok' "${out}")" != "true" ]; then
              echo "::error::${label} failed: $(jq -r '.error.code // "error"'): $(jq -r '.error.cause // .error.message // "unknown"')"
              jq -c '.error' "${out}" || true
              exit 1
            fi
            cp "${out}" "${RUNNER_TEMP}/cmis-${label// /-}.json"
          }

          # Resolve Octopus space name -> id (cmis puts octopusSpace into /api/{space}/...).
          octopus_root="${OCTOPUS_URL%/}"
          spaces_json="${RUNNER_TEMP}/octopus-spaces.json"
          if ! curl -fsS -H "X-Octopus-ApiKey: ${OCTOPUS_API_KEY}" \
            "${octopus_root}/api/spaces/all" -o "${spaces_json}"; then
            echo "::error::Octopus auth failed calling ${octopus_root}/api/spaces/all."
            exit 1
          fi
          octopus_space_id=$(OCTOPUS_SPACE="${OCTOPUS_SPACE}" python3 - "${spaces_json}" << 'PY'
          import json, os, sys
          payload = json.load(open(sys.argv[1]))
          spaces = payload if isinstance(payload, list) else payload.get("Items") or payload.get("items") or []
          wanted = os.environ["OCTOPUS_SPACE"]
          for space in spaces:
              if wanted in (space.get("Id"), space.get("Name"), space.get("Slug")):
                  print(space["Id"])
                  raise SystemExit(0)
          names = ", ".join(sorted(space.get("Name") or space.get("Id") or "?" for space in spaces))
          print(f"No Octopus space matches '{wanted}'. Spaces: {names}", file=sys.stderr)
          raise SystemExit(1)
          PY
          )
          echo "Octopus space id: ${octopus_space_id}"

          cmis_ok "add-board" connections add \
            --id bootcamp-board \
            --name "Project board" \
            --tracker GitHub \
            --coordinate "owner=${owner}" \
            --coordinate "ownerType=organization" \
            --coordinate "repo=${repo}" \
            --coordinate "projectNumber=1" \
            "${common[@]}"

          cmis_ok "add-delivery" connections add \
            --id bootcamp \
            --name "Delivery" \
            --tracker GitHubDelivery \
            --coordinate "owner=${owner}" \
            --coordinate "repo=${repo}" \
            --coordinate "octopusServer=${OCTOPUS_URL}" \
            --coordinate "octopusSpace=${octopus_space_id}" \
            --coordinate "octopusProject=${OCTOPUS_PROJECT}" \
            --coordinate "environments=auto" \
            "${common[@]}"

          # Calendar months from window start through current month (UTC).
          months_file="${RUNNER_TEMP}/harvest-months.json"
          python3 - "${since}" "${until}" "${months_file}" << 'PY'
          import json, sys
          from calendar import monthrange
          from datetime import date

          since = date.fromisoformat(sys.argv[1])
          until = date.fromisoformat(sys.argv[2])
          months = []
          y, m = since.year, since.month
          while True:
              start = date(y, m, 1)
              if start > until:
                  break
              last = monthrange(y, m)[1]
              end = min(date(y, m, last), until)
              chunk_since = max(start, since)
              months.append({
                  "label": f"{y:04d}-{m:02d}",
                  "since": chunk_since.isoformat(),
                  "until": end.isoformat(),
              })
              if m == 12:
                  y, m = y + 1, 1
              else:
                  m += 1
          json.dump(months, open(sys.argv[3], "w"))
          print(f"Harvest months ({len(months)}):")
          for row in months:
              print(f"  {row['label']}: {row['since']} .. {row['until']}")
          PY

          log_rate_limit() {
            local label="$1"
            echo "----- GitHub rate_limit before ${label} -----"
            gh api rate_limit --jq '{
              core: .resources.core|{remaining,limit,reset,resetLocal:(.reset|todateiso8601)},
              search: .resources.search|{remaining,limit,reset,resetLocal:(.reset|todateiso8601)},
              graphql: .resources.graphql|{remaining,limit,reset,resetLocal:(.reset|todateiso8601)}
            }' || echo "::warning::gh api rate_limit failed"
          }

          sleep_for_rate_limit() {
            # Prefer Retry-After / suggested seconds; optionally extend toward
            # x-ratelimit-reset, but keep a tight cap so 22 months can finish.
            local suggested="$1"
            local reset
            reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo "")
            local now
            now=$(date +%s)
            local wait="${suggested:-60}"
            if [ -n "${reset}" ] && [ "${reset}" -gt "${now}" ]; then
              local until_reset=$((reset - now + 5))
              # Only wait for reset when remaining core budget is exhausted.
              local remaining
              remaining=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "1")
              if [ "${remaining}" = "0" ] && [ "${until_reset}" -gt "${wait}" ]; then
                wait="${until_reset}"
              fi
            fi
            if [ "${wait}" -gt 180 ]; then
              wait=180
            fi
            if [ "${wait}" -lt 30 ]; then
              wait=30
            fi
            echo "Sleeping ${wait}s for rate-limit / 403 backoff (cap 180s)"
            sleep "${wait}"
          }

          write_months_status() {
            printf '%s\n' "${status_rows}" > "${months_status}"
          }

          record_month() {
            # Always succeed recording so set -e cannot abort the month loop.
            set +e
            status_rows=$(
              MONTH_JSON="$1" STATUS_ROWS="${status_rows}" python3 - << 'PY'
          import json, os
          rows = json.loads(os.environ["STATUS_ROWS"])
          rows.append(json.loads(os.environ["MONTH_JSON"]))
          print(json.dumps(rows))
          PY
            )
            local rc=$?
            set -e
            if [ "${rc}" -ne 0 ] || [ -z "${status_rows}" ]; then
              echo "::warning::failed to append month status row"
              status_rows="${status_rows:-[]}"
            fi
            write_months_status
          }

          receipts_dir="${RUNNER_TEMP}/harvest-receipts"
          mkdir -p "${receipts_dir}"
          month_timeout="${CMIS_MONTH_TIMEOUT_SECS:-900}"
          month_pause="${CMIS_MONTH_PAUSE_SECS:-45}"
          status_rows='[]'

          harvest_month() {
            local month_since="$1"
            local month_until="$2"
            local month_label="$3"
            local attempt=1
            local max_attempts=3
            local receipt="${receipts_dir}/${month_label}.json"
            while true; do
              log_rate_limit "${month_label} attempt ${attempt}"
              local stamp
              stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "===== ${stamp} START month ${month_label} ${month_since}..${month_until} attempt ${attempt}/${max_attempts} ====="
              local out="${RUNNER_TEMP}/cmis-last.json"
              local err="${RUNNER_TEMP}/cmis-last.err"
              : > "${out}"
              : > "${err}"
              local start_epoch
              start_epoch="$(date +%s)"
              set +e
              (
                while true; do
                  sleep 30
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) still harvesting ${month_label} (elapsed $(( $(date +%s) - start_epoch ))s / ${month_timeout}s)"
                done
              ) &
              local hb_pid=$!
              timeout --signal=TERM --kill-after=45s "${month_timeout}" \
                "${cmis}" connections harvest \
                  --since "${month_since}" \
                  --until "${month_until}" \
                  --on-failure strict \
                  "${common[@]}" > "${out}" 2>"${err}"
              local code=$?
              kill "${hb_pid}" 2>/dev/null || true
              wait "${hb_pid}" 2>/dev/null || true
              set -e
              local elapsed=$(( $(date +%s) - start_epoch ))
              if [ -s "${err}" ]; then
                echo "----- ${month_label} stderr (tail) -----"
                tail -n 40 "${err}" || true
              fi

              if [ "${code}" -eq 0 ] && [ "$(jq -r '.ok // empty' "${out}")" = "true" ]; then
                cp "${out}" "${receipt}"
                local raw rows
                raw="$(jq -r '.data.totalRawItems // 0' "${out}")"
                rows="$(jq -r '.data.totalRowsAdded // 0' "${out}")"
                echo "===== DONE ${month_label} in ${elapsed}s raw=${raw} rows=${rows} ====="
                jq -c '.data.connections[]?|{connectionId,succeeded,error,rawItems,rowsAdded}' "${out}" || true
                record_month "$(jq -nc \
                  --arg m "${month_label}" --arg s "${month_since}" --arg u "${month_until}" \
                  --argjson raw "${raw}" --argjson rows "${rows}" --argjson el "${elapsed}" \
                  '{month:$m,since:$s,until:$u,ok:true,error:null,rawItems:$raw,rowsAdded:$rows,elapsedSeconds:$el}')"
                return 0
              fi

              local err_code err_cause warn_cause conn_err
              err_code="$(jq -r '.error.code // empty' "${out}" 2>/dev/null || true)"
              err_cause="$(jq -r '.error.cause // empty' "${out}" 2>/dev/null || true)"
              warn_cause="$(jq -r '[.warnings[]?.cause] | join("; ")' "${out}" 2>/dev/null || true)"
              conn_err="$(jq -r '[.data.connections[]?|select(.succeeded==false)|.connectionId+": "+(.error//"")]|join(" | ")' "${out}" 2>/dev/null || true)"
              local combined="${err_cause} ${warn_cause} ${conn_err}"
              echo "::warning::month ${month_label} attempt ${attempt} failed (exit ${code}, ${elapsed}s, code=${err_code:-unknown})"
              jq -c '{ok, error, warnings, data:(.data|{failedCount, connections:[.connections[]?|{connectionId,succeeded,error}]})}' "${out}" 2>/dev/null || cat "${out}" || true

              local is_403=0
              if printf '%s' "${combined}" | grep -Eqi '403|Forbidden|rate limit|abuse'; then
                is_403=1
              fi

              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "::error::month ${month_label} failed after ${max_attempts} attempts."
                record_month "$(jq -nc \
                  --arg m "${month_label}" --arg s "${month_since}" --arg u "${month_until}" \
                  --argjson code "${code}" --arg ec "${err_code}" --arg cause "${err_cause}" \
                  --arg warn "${warn_cause}" --arg conn "${conn_err}" --argjson el "${elapsed}" \
                  '{month:$m,since:$s,until:$u,ok:false,error:{exitCode:$code,code:(if $ec=="" then null else $ec end),cause:(if $cause=="" then null else $cause end),warnings:(if $warn=="" then null else $warn end),connections:(if $conn=="" then null else $conn end)},rawItems:0,rowsAdded:0,elapsedSeconds:$el}')"
                return 1
              fi

              if [ "${is_403}" -eq 1 ] || [ "${code}" -eq 124 ] || [ "${code}" -eq 137 ]; then
                local retry_after=""
                retry_after=$(gh api -i rate_limit 2>/dev/null | awk -F': ' 'tolower($1)=="retry-after"{gsub(/\r/,"",$2); print $2; exit}' || true)
                if [ -n "${retry_after}" ]; then
                  sleep_for_rate_limit "${retry_after}"
                else
                  sleep_for_rate_limit $((45 * attempt))
                fi
              else
                echo "Sleeping 30s before non-403 retry"
                sleep 30
              fi
              attempt=$((attempt + 1))
            done
          }

          month_count=$(jq 'length' "${months_file}")
          month_index=0
          failed_months=0
          write_months_status
          while [ "${month_index}" -lt "${month_count}" ]; do
            month_label=$(jq -r ".[${month_index}].label" "${months_file}")
            month_since=$(jq -r ".[${month_index}].since" "${months_file}")
            month_until=$(jq -r ".[${month_index}].until" "${months_file}")
            echo "########## month $((month_index + 1))/${month_count}: ${month_label} ${month_since}..${month_until} ##########"
            set +e
            harvest_month "${month_since}" "${month_until}" "${month_label}"
            month_rc=$?
            set -e
            if [ "${month_rc}" -ne 0 ]; then
              failed_months=$((failed_months + 1))
              echo "Continuing after failed month ${month_label} (failed_months=${failed_months})"
            fi
            month_index=$((month_index + 1))
            if [ "${month_index}" -lt "${month_count}" ]; then
              echo "Pausing ${month_pause}s before next month"
              sleep "${month_pause}"
            fi
          done

          write_months_status
          echo "${status_rows}" | tee "${months_status}" | jq .
          python3 - "${receipts_dir}" "${since}" "${until}" "${harvest_json}" "${months_status}" << 'PY'
          import json, sys
          from pathlib import Path
          receipts_dir, since, until, out_path, status_path = sys.argv[1:]
          status = json.load(open(status_path))
          receipts = []
          for path in sorted(Path(receipts_dir).glob("*.json")):
              payload = json.loads(path.read_text())
              data = payload.get("data") or {}
              receipts.append({
                  "file": path.name,
                  "totalRawItems": data.get("totalRawItems") or 0,
                  "totalRowsAdded": data.get("totalRowsAdded") or 0,
                  "connections": data.get("connections") or [],
              })
          out = {
              "ok": all(row.get("ok") for row in status) if status else False,
              "data": {
                  "since": since,
                  "until": until,
                  "totalRawItems": sum(r["totalRawItems"] for r in receipts),
                  "totalRowsAdded": sum(r["totalRowsAdded"] for r in receipts),
                  "failedCount": sum(1 for row in status if not row.get("ok")),
                  "monthCount": len(status),
                  "succeededMonths": [row["month"] for row in status if row.get("ok")],
                  "failedMonths": [row["month"] for row in status if not row.get("ok")],
                  "months": status,
                  "connections": [c for r in receipts for c in r["connections"]],
              },
          }
          json.dump(out, open(out_path, "w"))
          print(
              f"Merged {len(receipts)} month receipts: "
              f"raw={out['data']['totalRawItems']} rows={out['data']['totalRowsAdded']} "
              f"failed_months={out['data']['failedCount']}"
          )
          PY

          succeeded_count=$(jq '[.[]|select(.ok==true)]|length' "${months_status}")
          if [ "${succeeded_count}" -eq 0 ]; then
            echo "::error::Every month harvest failed; refusing to render an empty scorecard."
            {
              echo "## Intelligence scorecard — monthly harvest failed"
              echo ""
              echo "No month succeeded. See \`months-status.json\` in the run logs / artifacts."
              jq -r '.[] | "- `\(.month)`: ok=\(.ok) error=\(.error|@json)"' "${months_status}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          cmis_ok "add-scorecard" scorecards add \
            --id delivery \
            --name "Delivery" \
            --connection bootcamp \
            --connection bootcamp-board \
            --period week \
            --since "${since}" \
            --until "${until}" \
            --set Delivery \
            "${common[@]}"

          cmis_ok "render" scorecards render --id delivery "${common[@]}"
          cp "${RUNNER_TEMP}/cmis-last.json" "${render_json}"

          python3 - "${render_json}" "${harvest_json}" "${report}" "${since}" "${until}" "${tag}" "${asset}" "${months_status}" << 'PY'
          import html
          import json
          import os
          import sys

          render_path, harvest_path, report_path, since, until, tag, asset, months_path = sys.argv[1:]
          render = json.load(open(render_path))
          harvest = json.load(open(harvest_path))
          months = json.load(open(months_path))
          if render.get("ok") is not True:
              sys.exit("render envelope is not ok")
          data = render.get("data") or {}
          sections = data.get("sections") or []
          if not sections:
              sys.exit("scorecards render returned no sections; refusing an empty report")

          WEEK_KEYS = ("periodStart", "label", "period", "periodLabel", "name")
          METRIC_SKIP = set(WEEK_KEYS) | {"periodEnd", "period_end", "id"}

          def esc(value):
              return html.escape("" if value is None else str(value))

          def period_rows(section):
              if not isinstance(section, dict):
                  return []
              for key in ("rows", "periods", "points", "values"):
                  value = section.get(key)
                  if isinstance(value, list) and value and isinstance(value[0], dict):
                      return value
              return []

          def week_sort_key(row):
              return str(row.get("periodStart") or row.get("label") or row.get("periodLabel") or "")

          def week_label(row):
              return str(row.get("label") or row.get("periodLabel") or row.get("periodStart") or row.get("name") or "?")

          def metric_names(rows):
              names = []
              for row in rows:
                  for key in row.keys():
                      if key in METRIC_SKIP or key in names:
                          continue
                      names.append(key)
              return names

          def format_cell(value):
              if value is None:
                  return ""
              if isinstance(value, float):
                  return f"{value:.4g}"
              return str(value)

          parts = []
          summary_lines = [
              "## Intelligence scorecard",
              "",
              f"- Repository: `{os.environ.get('GITHUB_REPOSITORY', '')}`",
              f"- Window: `{since}` through `{until}` (UTC)",
              f"- Harvest: calendar months (pause between months; 403 backoff)",
              f"- cmis: `{tag}` (`{asset}`)",
              f"- Scorecard: `{data.get('name') or data.get('id') or 'delivery'}`",
              f"- Week columns: newest on the left",
              "",
              "### Monthly harvest",
              "",
          ]
          for row in months:
              if row.get("ok"):
                  summary_lines.append(
                      f"- `{row['month']}` OK — raw `{row.get('rawItems')}`, rows `{row.get('rowsAdded')}`, {row.get('elapsedSeconds')}s"
                  )
              else:
                  err = row.get("error") or {}
                  summary_lines.append(
                      f"- `{row['month']}` FAILED — exit `{err.get('exitCode')}`, code `{err.get('code')}`, "
                      f"cause `{(err.get('cause') or '')[:180]}`, warnings `{(err.get('warnings') or '')[:180]}`"
                  )
          summary_lines.append("")

          table_count = 0
          last_week_labels = []
          for section in sections:
              title = (section.get("name") or section.get("id") or "Section") if isinstance(section, dict) else "Section"
              rows = period_rows(section)
              parts.append(f"<h2>{esc(title)}</h2>")
              if not rows:
                  parts.append("<pre>" + esc(json.dumps(section, indent=2)[:8000]) + "</pre>")
                  summary_lines.append(f"- {title}: no period rows")
                  continue

              weeks = sorted(rows, key=week_sort_key, reverse=True)
              metrics = metric_names(weeks)
              if not metrics:
                  parts.append("<pre>" + esc(json.dumps(section, indent=2)[:8000]) + "</pre>")
                  summary_lines.append(f"- {title}: no metrics")
                  continue

              table_count += 1
              week_labels = [week_label(week) for week in weeks]
              last_week_labels = week_labels
              summary_lines.append(f"### {title}")
              summary_lines.append("")
              summary_lines.append(f"{len(weeks)} weeks · newest `{week_labels[0]}` · oldest `{week_labels[-1]}`")
              summary_lines.append("")
              header = "| Metric | " + " | ".join(f"`{label}`" for label in week_labels) + " |"
              sep = "| --- | " + " | ".join(["---"] * len(week_labels)) + " |"
              summary_lines.append(header)
              summary_lines.append(sep)
              for metric in metrics:
                  cells = [format_cell(week.get(metric)) for week in weeks]
                  summary_lines.append("| " + " | ".join([f"`{metric}`"] + cells) + " |")
              summary_lines.append("")

              parts.append('<div class="scroll"><table><thead><tr><th>Metric</th>')
              parts.append("".join(f"<th>{esc(label)}</th>" for label in week_labels))
              parts.append("</tr></thead><tbody>")
              for metric in metrics:
                  parts.append(f"<tr><th scope=\"row\">{esc(metric)}</th>")
                  parts.append("".join(f"<td>{esc(format_cell(week.get(metric)))}</td>" for week in weeks))
                  parts.append("</tr>")
              parts.append("</tbody></table></div>")

          if table_count == 0:
              sys.exit("scorecards render sections had no rows; refusing an empty report")

          harvest_data = harvest.get("data") if isinstance(harvest, dict) else None
          if isinstance(harvest_data, dict):
              summary_lines.append(
                  f"- Harvest totals: `{harvest_data.get('totalRawItems')}` raw items, "
                  f"`{harvest_data.get('totalRowsAdded')}` normalized rows, "
                  f"`{harvest_data.get('failedCount')}` failed months"
              )
              summary_lines.append("")

          document = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Intelligence scorecard {esc(os.environ.get('GITHUB_REPOSITORY', ''))}</title>
          <style>
            body {{ font-family: sans-serif; margin: 2rem; color: #1a1a1a; }}
            .scroll {{ overflow-x: auto; max-width: 100%; margin: 0 0 2rem; }}
            table {{ border-collapse: collapse; }}
            th, td {{ border: 1px solid #ccc; padding: 0.35rem 0.6rem; text-align: left; white-space: nowrap; }}
            thead th {{ background: #f4f4f4; position: sticky; top: 0; }}
            tbody th {{ background: #fafafa; text-align: left; }}
          </style>
          </head>
          <body>
          <h1>Intelligence scorecard</h1>
          <p>{esc(os.environ.get('GITHUB_REPOSITORY', ''))} · {esc(since)} through {esc(until)} UTC · monthly harvest · cmis {esc(tag)} · weeks newest on the left</p>
          {''.join(parts)}
          </body>
          </html>
          """
          with open(report_path, "w", encoding="utf-8") as handle:
              handle.write(document)
          if os.path.getsize(report_path) < 200:
              sys.exit("HTML report is empty")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary_lines) + "\n")
          print(f"Wrote {report_path} ({os.path.getsize(report_path)} bytes)")
          if last_week_labels:
              print(
                  "Week columns (newest first): "
                  + ", ".join(last_week_labels[:3])
                  + (" ..." if len(last_week_labels) > 3 else "")
                  + (f" ... {last_week_labels[-1]}" if len(last_week_labels) > 3 else "")
              )
          PY

          if [ "${failed_months}" -gt 0 ]; then
            echo "::error::${failed_months} month(s) failed. HTML report was still produced from successful months."
            exit 1
          fi

      - name: Upload HTML scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-scorecard
          path: |
            scorecard-report/intelligence-scorecard.html
            scorecard-report/months-status.json
          if-no-files-found: warn
          retention-days: 30
