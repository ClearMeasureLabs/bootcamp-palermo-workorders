# Daily Clear Measure Intelligence Scorecard for this repository.
# Installs the latest cmis release, harvests GitHub and Octopus delivery data,
# and publishes an HTML report. Discovery of the installer and CLI surface is
# logged on the first runs; harvest is wired from that help output.
name: Intelligence Scorecard

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  # Lets this workflow run on the PR branch before it exists on the default branch.
  # Removed once workflow_dispatch on the branch is confirmed, if GitHub accepts it.
  push:
    branches:
      - cursor/daily-cmis-scorecard-22a1

permissions:
  contents: read

jobs:
  scorecard:
    name: Delivery scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install latest cmis and print command help
        env:
          CMIS_GITHUB_TOKEN: ${{ secrets.CMIS_GITHUB_TOKEN }}
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
          SCORECARD_REPO: ClearMeasure/Clear-Measure-Intelligence-Scorecard
        run: |
          set -euo pipefail
          if [ -n "${CMIS_GITHUB_TOKEN}" ]; then
            echo "Release token: CMIS_GITHUB_TOKEN"
            export GH_TOKEN="${CMIS_GITHUB_TOKEN}"
          elif [ -n "${COPILOT_PAT}" ]; then
            echo "Release token: COPILOT_PAT (CMIS_GITHUB_TOKEN is not set)"
            export GH_TOKEN="${COPILOT_PAT}"
          else
            echo "::error::No token can read ${SCORECARD_REPO}. Add repository secret CMIS_GITHUB_TOKEN with contents:read on that repository."
            exit 1
          fi

          dest="${RUNNER_TEMP}/cmis-release"
          mkdir -p "${dest}"
          echo "Resolving GitHub Latest release of ${SCORECARD_REPO}"
          gh release view --repo "${SCORECARD_REPO}" --json tagName,name,isDraft,isPrerelease,assets,body \
            > "${dest}/release.json"
          echo "tag=$(jq -r .tagName "${dest}/release.json")"
          echo "name=$(jq -r .name "${dest}/release.json")"
          echo "assets:"
          jq -r '.assets[] | "\(.name)\t\(.size)\t\(.content_type)"' "${dest}/release.json"
          echo "----- release body -----"
          jq -r .body "${dest}/release.json"
          echo "----- end release body -----"

          echo "===== cmis assets across recent releases ====="
          gh api --paginate "repos/${SCORECARD_REPO}/releases?per_page=100" \
            --jq '.[] | select(any(.assets[]; .name | test("cmis";"i"))) | {tag:.tag_name, prerelease, assets:[.assets[].name]}' \
            > "${dest}/cmis-releases.jsonl"
          cat "${dest}/cmis-releases.jsonl"

          tag=$(jq -s -r '.[0].tag // empty' "${dest}/cmis-releases.jsonl")
          asset=$(jq -s -r '[.[0].assets[] | select(test("linux-x64"))][0] // empty' "${dest}/cmis-releases.jsonl")
          if [ -z "${tag}" ] || [ "${tag}" = "null" ] || [ -z "${asset}" ]; then
            echo "::error::No linux-x64 cmis asset found on ${SCORECARD_REPO} releases."
            exit 1
          fi
          echo "Installing ${asset} from ${tag}"
          gh release download "${tag}" --repo "${SCORECARD_REPO}" --pattern "${asset}" --dir "${dest}" --clobber
          mkdir -p "${dest}/tool"
          tar -xzf "${dest}/${asset}" -C "${dest}/tool"
          find "${dest}/tool" -maxdepth 3 -printf '%y %p\n'
          cmis=$(find "${dest}/tool" -type f -name cmis | head -n 1)
          if [ -z "${cmis}" ]; then
            echo "::error::cmis binary not found inside ${asset}"
            exit 1
          fi
          chmod +x "${cmis}"
          echo "binary=${cmis}"
          "${cmis}" --version || true

          help_file="${dest}/help.txt"
          : > "${help_file}"
          dump() {
            echo "===== $* --help =====" | tee -a "${help_file}"
            set +e
            "$@" --help >> "${help_file}" 2>&1
            local code=$?
            set -e
            echo "exit=${code}" | tee -a "${help_file}"
          }
          dump "${cmis}"
          # One level of subcommands, parsed from the top-level help, then one more level.
          mapfile -t commands < <(awk '
            tolower($0) ~ /^commands:/ { in_cmds=1; next }
            in_cmds && /^$/ { exit }
            in_cmds && /^[[:space:]]+[A-Za-z0-9]/ { print $1 }
          ' "${help_file}")
          echo "top-level commands: ${commands[*]:-none}"
          for cmd in "${commands[@]}"; do
            dump "${cmis}" "${cmd}"
          done
          # Second level: look at each subcommand help for a Commands: section.
          for cmd in "${commands[@]}"; do
            mapfile -t nested < <(            awk -v section="===== ${cmis} ${cmd} --help =====" '
              $0 == section { on=1; next }
              on && /^===== / { exit }
              on && tolower($0) ~ /^commands:/ { in_cmds=1; next }
              on && in_cmds && /^$/ { exit }
              on && in_cmds && /^[[:space:]]+[A-Za-z0-9]/ { print $1 }
            ' "${help_file}")
            for sub in "${nested[@]}"; do
              dump "${cmis}" "${cmd}" "${sub}"
            done
          done
          echo "===== connect guidance GitHub ====="
          "${cmis}" connect guidance --tracker GitHub --json || true
          probe="${dest}/probe"
          mkdir -p "${probe}/ws" "${probe}/store"
          for tracker in GitHub GitHubDelivery Octopus; do
            echo "===== connections add --tracker ${tracker} --dry-run ====="
            "${cmis}" connections add \
              --tracker "${tracker}" \
              --id "probe-${tracker}" \
              --dry-run \
              --json \
              --workspace "${probe}/ws" \
              --store "${probe}/store" || true
          done
          echo "===== unknown coordinate (GitHubDelivery) ====="
          "${cmis}" connections add \
            --tracker GitHubDelivery \
            --id probe-delivery \
            --coordinate owner=ClearMeasureLabs \
            --coordinate repo=bootcamp-palermo-workorders \
            --coordinate notAKey=1 \
            --dry-run --json \
            --workspace "${probe}/ws" \
            --store "${probe}/store" || true
          echo "===== unknown coordinate (GitHub) ====="
          "${cmis}" connections add \
            --tracker GitHub \
            --id probe-gh \
            --coordinate owner=ClearMeasureLabs \
            --coordinate ownerType=organization \
            --coordinate repo=bootcamp-palermo-workorders \
            --coordinate projectNumber=1 \
            --coordinate notAKey=1 \
            --dry-run --json \
            --workspace "${probe}/ws" \
            --store "${probe}/store" || true
          echo "===== valid GitHubDelivery dry-run ====="
          "${cmis}" connections add \
            --tracker GitHubDelivery \
            --id probe-delivery-ok \
            --coordinate owner=ClearMeasureLabs \
            --coordinate repo=bootcamp-palermo-workorders \
            --dry-run --json \
            --workspace "${probe}/ws" \
            --store "${probe}/store" || true
          echo "===== source search ====="
          src="${dest}/src"
          mkdir -p "${src}"
          gh release download "${tag}" --repo "${SCORECARD_REPO}" --archive tar.gz --dir "${src}" --clobber
          tar -xzf "${src}"/*.tar.gz -C "${src}"
          root=$(find "${src}" -mindepth 1 -maxdepth 1 -type d -print -quit)
          echo "source=${root}"
          grep -R -n --include='*.cs' -E 'OctopusServer|OctopusSpace|OctopusProject|RequireOctopusKey|RequiredCoordinateKeys' "${root}" || true
          def="${root}/Scorecard.Core/DeliveryProcess/DeliveryProcessDefinition.cs"
          factory="${root}/Scorecard.AppServices/Cmis/ConnectionProviderFactory.cs"
          echo "===== DeliveryProcessDefinition 90-180 ====="
          sed -n '90,180p' "${def}"
          echo "===== DeliveryProcessDefinition 380-480 ====="
          sed -n '380,480p' "${def}"
          echo "===== ConnectionProviderFactory 140-260 ====="
          sed -n '140,260p' "${factory}"
          echo "===== ConnectionKey.cs ====="
          sed -n '1,120p' "${root}/Scorecard.AppServices/Connect/ConnectionKey.cs"
          echo "===== ownerType comparisons ====="
          grep -R -n --include='*.cs' -E 'ownerType|OwnerType' "${root}/Scorecard.GitHub" "${root}/Scorecard.AppServices" | grep -v '/obj/' || true
          echo "===== scorecard Render methods ====="
          grep -R -n --include='*.cs' 'Render(' "${root}/Scorecard.Presentation" "${root}/Scorecard.AppServices" | grep -v '/obj/' | grep -v Test || true
          echo "Probe captured."
          exit 1
