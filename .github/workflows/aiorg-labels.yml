# aiorg: create the labels the org routes on (idempotent). Issue forms and triage only apply labels
# that exist, so run this once after enabling (Actions > aiorg-labels > Run workflow); it also runs
# when .aiorg/config.yaml changes on the default branch.
name: aiorg-labels
on:
  workflow_dispatch:
  push:
    paths: [".aiorg/config.yaml"]
permissions:
  contents: read
  issues: write
concurrency:
  group: aiorg-labels
  cancel-in-progress: false
jobs:
  labels:
    if: vars.AIORG_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AIORG_HOME: ${{ github.workspace }}/aiorg
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out aiorg control plane (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jeffreypalermo/aiorg
          ref: "23c89d483adca8d894142408433fa8b3dfe01d3f"
          path: aiorg
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Build aiorg CLI
        working-directory: aiorg
        run: dotnet build src/Aiorg.Cli -c Release -o ../aiorg-bin --nologo -v quiet
      - name: Create or correct the aiorg labels
        run: dotnet aiorg-bin/aiorg.dll labels sync --repo "$REPO"
