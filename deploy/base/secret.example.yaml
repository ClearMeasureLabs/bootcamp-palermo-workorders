# EXAMPLE ONLY — do not commit real secrets.
# For the throwaway cluster, create the real secret out-of-band (kubectl, not Git):
#
#   kubectl -n workorders create secret generic workorders-secrets \
#     --from-literal=SqlConnectionString='Server=tcp:...;Database=...;User ID=...;Password=...;'
#
# In a real GitOps setup this becomes a SealedSecret / External Secrets / Key Vault CSI ref
# so nothing sensitive lives in the manifests repo. This file is a template, kept out of
# kustomization.yaml so it never gets applied.
apiVersion: v1
kind: Secret
metadata:
  name: workorders-secrets
  namespace: workorders
type: Opaque
stringData:
  SqlConnectionString: "REPLACE_ME"
