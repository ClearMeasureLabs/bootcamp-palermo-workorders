apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Note: secret.example.yaml is intentionally NOT listed here — the real secret is
# created out-of-band on the throwaway cluster so credentials never land in Git.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

namespace: workorders
