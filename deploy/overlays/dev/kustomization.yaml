apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# This is the single line Argo CD reconciles and that Octopus's
# "Update Argo CD Application Image Tag" step rewrites on each release.
# Point newTag at the tag you built/pushed in walkthrough step 2.
images:
  - name: REGISTRY_PLACEHOLDER/workorders
    newName: REGISTRY_PLACEHOLDER/workorders
    newTag: "0.1.0"

# Environment-scoped labels for the Octopus/Argo "organize apps by environment" annotations.
commonLabels:
  app.kubernetes.io/environment: dev
