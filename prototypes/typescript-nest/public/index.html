<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Orders</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;color:#1e293b}h1{color:#123b5d}form,.card{border:1px solid #cbd5e1;border-radius:8px;padding:1rem;margin:1rem 0}label{display:block;margin:.6rem 0}input,textarea,button{font:inherit;padding:.5rem}input,textarea{width:96%}button{cursor:pointer;background:#155e75;color:white;border:0;border-radius:4px;margin:.25rem}.status{font-weight:bold;color:#0e7490}.due-date-today{background:#fef08a}.due-date-overdue{background:#fecaca}.urgency{font-weight:bold;border-radius:4px;padding:.15rem .4rem}</style></head>
<body><h1>Work Orders</h1><p id="health">Checking service…</p>
<form id="create-form"><h2>Save a draft</h2><label>Title <input name="title" required minlength="1" data-testid="title"></label><label>Description <textarea name="description" data-testid="description"></textarea></label><label>Instructions <textarea name="instructions" data-testid="instructions" maxlength="4000"></textarea></label><label>Room <input name="roomNumber" data-testid="room" maxlength="900"></label><label>Due date <input name="dueDate" type="date" data-testid="due-date"></label><button data-testid="save-draft">Save draft</button></form>
<section><h2>Work order list</h2><form id="search-form"><label>Search <input name="q" data-testid="search-text"></label><label>Assignee username <input name="assignee" data-testid="search-assignee"></label><button data-testid="search">Search</button><button type="reset" data-testid="clear-search">Clear</button></form><div id="orders"></div></section><p id="message" role="status"></p>
<script>
const api='/api/work-orders'; const message=document.querySelector('#message');
async function refresh(){const filters=new URLSearchParams(new FormData(document.querySelector('#search-form')));const items=await (await fetch(`${api}?${filters}`)).json();document.querySelector('#orders').innerHTML=items.map(o=>`<article class="card" data-testid="order-${o.id}"><h3>${esc(o.number)} — ${esc(o.title)}</h3><p>${esc(o.description)}</p>${o.instructions?`<p><strong>Instructions:</strong> ${esc(o.instructions)}</p>`:''}<p>Room ${esc(o.roomNumber||'—')} · <span class="status">${esc(o.status)}</span> · Assignee ${esc(o.assignee||'—')}</p>${o.dueDate?`<p class="${o.urgency==='DueToday'?'due-date-today':o.urgency==='Overdue'?'due-date-overdue':''}" data-testid="due-date-value">Due ${esc(o.dueDate)} <span class="urgency">${esc(o.dueDateBadge)}</span></p>`:''}<div>${o.status==='Draft'?`<button data-action="assign" data-id="${o.id}">Assign</button>`:''}${o.status==='Assigned'?`<button data-action="begin" data-id="${o.id}">Begin</button>`:''}${o.status==='InProgress'?`<button data-action="complete" data-id="${o.id}">Complete</button>`:''}</div></article>`).join('')||'<p>No work orders found.</p>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.querySelector('#create-form').addEventListener('submit',async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok){message.textContent=(await r.json()).message;return;}message.textContent='Draft saved';e.target.reset();await refresh();});
document.querySelector('#search-form').addEventListener('submit',async e=>{e.preventDefault();await refresh();});
document.querySelector('#search-form').addEventListener('reset',()=>setTimeout(refresh,0));
document.querySelector('#orders').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;let status={assign:'Assigned',begin:'InProgress',complete:'Complete'}[b.dataset.action];let body={status};if(status==='Assigned')body.assignee='demo.tech';let r=await fetch(`${api}/${b.dataset.id}/transitions`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const label=status==='InProgress'?'in progress':status.toLowerCase();message.textContent=r.ok?`Work order ${label}`:(await r.json()).message;await refresh();});
fetch('/api/health').then(r=>r.json()).then(v=>document.querySelector('#health').textContent=`Service: ${v.status}`).catch(()=>document.querySelector('#health').textContent='Service unavailable'); refresh();
</script></body></html>
