<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Orders</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;color:#1e293b}h1{color:#123b5d}form,.card{border:1px solid #cbd5e1;border-radius:8px;padding:1rem;margin:1rem 0}label{display:block;margin:.6rem 0}input,textarea,button{font:inherit;padding:.5rem}input,textarea{width:96%}button{cursor:pointer;background:#155e75;color:white;border:0;border-radius:4px;margin:.25rem}.status{font-weight:bold;color:#0e7490}.error{color:#b91c1c}</style></head>
<body><h1>Work Orders</h1><p id="health">Checking service…</p>
<form id="create-form"><h2>Save a draft</h2><label>Title <input name="title" required minlength="1" data-testid="title"></label><label>Description <textarea name="description" data-testid="description"></textarea></label><label>Room <input name="roomNumber" data-testid="room"></label><button data-testid="save-draft">Save draft</button></form>
<section><h2>Work order list</h2><div id="orders"></div></section><p id="message" role="status"></p>
<script>
const api='/api/work-orders'; const message=document.querySelector('#message');
async function refresh(){const items=await (await fetch(api)).json();document.querySelector('#orders').innerHTML=items.map(o=>`<article class="card" data-testid="order-${o.id}"><h3>${esc(o.number)} — ${esc(o.title)}</h3><p>${esc(o.description)}</p><p>Room ${esc(o.roomNumber||'—')} · <span class="status">${esc(o.status)}</span></p><div>${o.status==='Draft'?`<button data-action="assign" data-id="${o.id}">Assign</button>`:''}${o.status==='Assigned'?`<button data-action="begin" data-id="${o.id}">Begin</button>`:''}${o.status==='InProgress'?`<button data-action="complete" data-id="${o.id}">Complete</button>`:''}</div></article>`).join('')||'<p>No work orders yet.</p>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.querySelector('#create-form').addEventListener('submit',async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok){message.textContent=(await r.json()).message;return;}message.textContent='Draft saved';e.target.reset();await refresh();});
document.querySelector('#orders').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;let status={assign:'Assigned',begin:'InProgress',complete:'Complete'}[b.dataset.action];let body={status};if(status==='Assigned')body.assignee='demo.tech';let r=await fetch(`${api}/${b.dataset.id}/transitions`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});message.textContent=r.ok?`Work order ${status.toLowerCase()}`:(await r.json()).message;await refresh();});
fetch('/api/health').then(r=>r.json()).then(v=>document.querySelector('#health').textContent=`Service: ${v.status}`).catch(()=>document.querySelector('#health').textContent='Service unavailable'); refresh();
</script></body></html>
