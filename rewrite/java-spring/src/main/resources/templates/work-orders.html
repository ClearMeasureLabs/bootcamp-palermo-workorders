<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Orders</title>
<style>body{font:16px system-ui,sans-serif;margin:2rem auto;max-width:1100px;padding:0 1rem;color:#172033}h1{color:#173f73}form.card{background:#f1f5f9;padding:1rem;border-radius:10px;display:grid;gap:.7rem;grid-template-columns:repeat(2,minmax(0,1fr))}label{display:grid;gap:.3rem}input,textarea,select,button{font:inherit;padding:.5rem}textarea{min-height:4rem}table{width:100%;border-collapse:collapse;margin-top:1.5rem}th,td{text-align:left;padding:.6rem;border-bottom:1px solid #cbd5e1}.notice{color:#176b43}.actions{display:flex;gap:.4rem}.actions form{display:inline}button{cursor:pointer;border:0;border-radius:5px;background:#17559a;color:white}.wide{grid-column:1/-1}.filters{margin-top:1rem}.due-date-today{background:#fef08a}.due-date-overdue{background:#fecaca}.urgency{display:inline-block;margin-left:.35rem;padding:.1rem .4rem;border-radius:999px;font-size:.8rem;background:#e2e8f0}.urgency-overdue{background:#fecaca}.urgency-due-today{background:#fef08a}</style></head>
<body><h1>Work Orders</h1>
<p th:if="${currentUser == null}"><a href="/login" data-testid="login-link">Login</a></p>
<div th:if="${currentUser != null}"><span data-testid="welcome-text">Welcome <span th:text="${currentUser.username}"></span>!</span>
<form method="post" action="/logout" style="display:inline"><button data-testid="logout-link">Logout</button></form></div>
<p th:if="${message}" class="notice" th:text="${message}"></p>
<h2 th:if="${currentUser != null and currentUser.canCreateWorkOrder()}">Create work order</h2>
<form th:if="${currentUser != null and currentUser.canCreateWorkOrder()}" class="card" method="post" action="/work-orders">
<label>Title <input name="title" maxlength="240" required></label><label>Room <input name="roomNumber" maxlength="900"></label>
<label>Due date <input type="date" name="dueDate"></label>
<label class="wide">Description <textarea name="description" maxlength="4000"></textarea></label>
<label class="wide">Instructions <textarea name="instructions" maxlength="4000"></textarea></label><button class="wide">Save draft</button></form>
<p th:if="${currentUser != null and !currentUser.canCreateWorkOrder()}" class="notice">Your employee roles do not allow creating work orders.</p>
<form class="filters" method="get"><label>Filter status <select name="status"><option value="">All</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option></select></label><label>Show overdue only <input type="checkbox" name="overdueOnly" value="true" th:checked="${overdueOnly}"></label><button>Filter</button></form>
<table><thead><tr><th>Number</th><th>Title</th><th>Creator</th><th>Room</th><th>Status</th><th>Assignee</th><th>Due</th><th>Actions</th></tr></thead><tbody>
<tr th:each="order:${orders}"><td th:text="${order.number}"></td><td th:text="${order.title}"></td><td th:text="${order.creatorName}"></td><td th:text="${order.roomNumber}"></td><td th:text="${order.status}"></td><td th:text="${order.assigneeName}"></td><td th:classappend="${order.dueDateCssClass}"><span th:text="${order.dueDate}"></span><span th:if="${order.dueDate != null}" class="urgency" th:classappend="${' ' + order.urgencyBadgeCssClass}" th:text="${order.urgencyBadgeText}"></span></td><td><div class="actions">
<form th:if="${currentUser != null and currentUser.username == order.creatorUsername and order.status.name() == 'DRAFT'}" th:action="@{/work-orders/{number}/assign(number=${order.number})}" method="post"><select name="assignee" required><option value="">Assign to employee</option><option th:each="employee:${fulfillmentEmployees}" th:value="${employee.username}" th:text="${employee.displayName}"></option></select><button>Assign</button></form>
<form th:if="${currentUser != null and currentUser.username == order.assigneeUsername and order.status.name() == 'ASSIGNED'}" th:action="@{/work-orders/{number}/begin(number=${order.number})}" method="post"><button>Begin</button></form>
<form th:if="${currentUser != null and currentUser.username == order.assigneeUsername and order.status.name() == 'IN_PROGRESS'}" th:action="@{/work-orders/{number}/shelve(number=${order.number})}" method="post"><button>Shelve</button></form>
<form th:if="${currentUser != null and currentUser.username == order.assigneeUsername and order.status.name() == 'IN_PROGRESS'}" th:action="@{/work-orders/{number}/complete(number=${order.number})}" method="post"><button>Complete</button></form>
<form th:if="${currentUser != null and currentUser.username == order.creatorUsername and order.status.name() != 'COMPLETE' and order.status.name() != 'CANCELLED'}" th:action="@{/work-orders/{number}/cancel(number=${order.number})}" method="post"><button>Cancel</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(orders)}"><td colspan="8">No work orders found.</td></tr></tbody></table></body></html>
