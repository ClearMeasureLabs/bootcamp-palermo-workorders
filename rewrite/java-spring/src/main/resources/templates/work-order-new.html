<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Work Order</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;color:#243247;background:#f5f7fb}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;background:#dbe4ee;border-right:1px solid #c8d3df}.brand{height:124px;padding:26px 28px;border-bottom:1px solid #c8d3df;display:flex;gap:14px;align-items:center;background:#e6edf5}.brand strong{display:block;font:bold 25px Georgia,serif}.brand em{font:italic 15px Georgia,serif;color:#66788d}.menu-title{padding:16px 28px;margin-top:16px;border-bottom:1px solid #bdcbd9}.nav-links{display:grid;padding:14px 0}.nav-links a{padding:10px 30px;color:#1764af;text-decoration:none}.workspace{margin-left:280px}.topbar{height:116px;background:#fff;border-bottom:1px solid #dce3ec;display:flex;justify-content:space-between;align-items:center;padding:18px 32px}.topbar h2{font:bold 32px Georgia,serif;margin:0;color:#22344a}.account{display:flex;gap:22px;align-items:center}.account button{border:0;background:none;font:inherit;cursor:pointer}main{max-width:1100px;margin:auto;padding:48px 40px}.card{background:white;border:1px solid #e0e5ec;border-radius:15px;padding:28px 32px;box-shadow:0 4px 14px #2839540b}.card h1{font: bold 36px Georgia,serif;color:#23364d;margin:0 0 22px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:grid;gap:8px;color:#47566b}input,textarea{font:inherit;padding:12px 14px;border:1px solid #d1d9e4;border-radius:8px;background:#fbfcfe}textarea{min-height:110px}.wide{grid-column:1/-1}button.primary{padding:13px 18px;border:0;border-radius:9px;background:linear-gradient(110deg,#785ce7,#367fe0);color:white;font:inherit;cursor:pointer}.link{color:#1764af}@media(max-width:760px){.sidebar{position:static;width:auto}.workspace{margin:0}.topbar{height:auto}.account{display:none}main{padding:20px 12px}form{grid-template-columns:1fr}}
</style></head>
<body><aside class="sidebar"><div class="brand"><span>▦</span><div><strong>First Church</strong><em>Springfield</em></div></div><div class="menu-title">Menu</div><nav class="nav-links"><a href="/">⌂　Home</a><a href="/work-orders/new">▣　New Work Order</a><a href="/">⌕　Search</a><a th:href="@{/(creator=${currentUser.username})}">▤　My Work Orders</a><a href="/?assignedToMe=true">☑　Assigned To Me</a></nav></aside>
<div class="workspace"><header class="topbar"><div><h2>Work Order Management</h2><em>Church Bulletin</em></div><div class="account"><span data-testid="welcome-text">Welcome <strong th:text="${currentUser.username}"></strong>!</span><form method="post" action="/logout"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button data-testid="logout-link">Logout</button></form></div></header>
<main><section class="card"><h1>New Work Order</h1><form method="post" action="/work-orders"><input type="hidden" name="_csrf" th:value="${csrfToken}">
<label class="wide">Title<input name="title" maxlength="300" required></label><label>Room<input name="roomNumber" maxlength="900"></label><label>Due date<input type="date" name="dueDate"></label>
<label class="wide">Description<textarea name="description" maxlength="4000"></textarea></label><label class="wide">Instructions<textarea name="instructions" maxlength="4000"></textarea></label>
<button class="primary wide">Save draft</button><a class="link" href="/">Cancel and return to search</a></form></section></main></div></body></html>
