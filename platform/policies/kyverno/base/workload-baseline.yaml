# policies/kyverno/base/workload-baseline.yaml
#
# Workload baseline for namespaces named workorders-* (ADR-D12, §7.9). Four ValidatingPolicies,
# so reports name the failed rule and a break-glass exception can target one rule only:
#
#   disallow-latest-tag       every container image pins a tag other than latest, or a digest
#   require-resources         CPU and memory requests and a memory limit on every container
#   require-probes            readiness and liveness probes on long-running workloads
#   disallow-privileged       no privileged containers and no host network, PID or IPC
#
# Deny and fail closed by default; overlays/nonprod switches to Audit. The app namespaces also
# enforce Pod Security "restricted" (argocd/clusters/<cluster>/namespaces.yaml); these policies
# additionally reject a bad Deployment, Job or Rollout at admission, so Argo CD shows the error on
# the sync instead of a ReplicaSet that silently cannot create pods.
#
# The Worker exemption: the Worker has no HTTP endpoint and no probes until WI-04 (§7.9, F5), so
# require-probes skips objects labelled app.kubernetes.io/name=worker. Remove that match
# condition when WI-04 adds the liveness signal (before the Worker is enabled in prod).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest tag
    policies.kyverno.io/category: Workload baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Container images must pin a tag other than latest, or a digest. Octopus writes release
      tags into gitops/workorders/envs/<env>/kustomization.yaml (§7.6).
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  matchConditions:
    - name: workorders-namespaces
      expression: "object.metadata.?namespace.orValue('').startsWith('workorders-')"
  variables:
    - name: containers
      expression: >-
        object.spec.?template.?spec.?containers.orValue([]) +
        object.spec.?template.?spec.?initContainers.orValue([])
  validations:
    # The tag is whatever follows ':' in the last path segment, so a registry port is not
    # mistaken for a tag.
    - expression: >-
        variables.containers.all(c,
          c.image.substring(c.image.lastIndexOf('/') + 1).contains('@') ||
          (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') &&
           !c.image.endsWith(':latest')))
      message: >-
        Every container image must pin a tag other than latest, or a digest.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require resource requests and memory limits
    policies.kyverno.io/category: Workload baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container and init container declares CPU and memory requests and a memory limit.
      CPU limits stay optional to avoid CPU throttling.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  matchConditions:
    - name: workorders-namespaces
      expression: "object.metadata.?namespace.orValue('').startsWith('workorders-')"
  variables:
    - name: containers
      expression: >-
        object.spec.?template.?spec.?containers.orValue([]) +
        object.spec.?template.?spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?resources.?requests.?cpu.hasValue() &&
          c.?resources.?requests.?memory.hasValue() &&
          c.?resources.?limits.?memory.hasValue())
      message: >-
        Every container needs resources.requests.cpu, resources.requests.memory and
        resources.limits.memory.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require readiness and liveness probes
    policies.kyverno.io/category: Workload baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Long-running workloads declare readiness and liveness probes. ui-server probes /alive on
      port 8080 until WI-01 delivers /ready (ADR-D12); never /_healthcheck.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # Jobs run to completion and need no probes.
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  matchConditions:
    - name: workorders-namespaces
      expression: "object.metadata.?namespace.orValue('').startsWith('workorders-')"
    # Remove when WI-04 adds the Worker liveness signal.
    - name: worker-exempt-until-wi-04
      expression: "object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != 'worker'"
  validations:
    # A Rollout with workloadRef has no template: its Deployment carries the probes.
    - expression: >-
        object.spec.?template.?spec.?containers.orValue([]).all(c,
          c.?readinessProbe.hasValue() && c.?livenessProbe.hasValue())
      message: >-
        Every container needs a readinessProbe and a livenessProbe (use /alive on port 8080,
        never /_healthcheck).
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged pods
    policies.kyverno.io/category: Workload baseline
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      No privileged containers and no host network, PID or IPC namespaces in workorders-*.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  matchConditions:
    - name: workorders-namespaces
      expression: "object.metadata.?namespace.orValue('').startsWith('workorders-')"
  variables:
    - name: containers
      expression: >-
        object.spec.?template.?spec.?containers.orValue([]) +
        object.spec.?template.?spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: >-
        Privileged containers are not allowed in workorders namespaces.
    - expression: >-
        !object.spec.?template.?spec.?hostNetwork.orValue(false) &&
        !object.spec.?template.?spec.?hostPID.orValue(false) &&
        !object.spec.?template.?spec.?hostIPC.orValue(false)
      message: >-
        Host network, PID and IPC namespaces are not allowed in workorders namespaces.
