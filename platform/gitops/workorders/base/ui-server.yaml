# gitops/workorders/base/ui-server.yaml
#
# UI.Server (app:src/UI/Server): Blazor host, API, gRPC, MCP and the in-process realtime hub.
# One replica: the WebSocket hub is in-process until WI-09 (ADR-C3).
# Rolling update with maxUnavailable 0 and maxSurge 1; startup, liveness and readiness all use
# /alive on 8080, which runs only the `self` check. /_healthcheck is never a probe: it runs every
# check, including the LLM, and belongs to the Octopus smoke step (ADR-D12, §7.9).
# Image: untagged; the tag comes from envs/<env>/kustomization.yaml (§7.6).
#
# Writer: H (platform owners). Contracts: §7.4, §7.6, §7.8, §7.9, ADR-C3, ADR-D12.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-server
  labels:
    app.kubernetes.io/name: ui-server
    app.kubernetes.io/component: web
  annotations:
    # Federated to id-workorders-{env}-app (§7.8); each config overlay sets the client ID.
    azure.workload.identity/client-id: <uami-client-id>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-server
  labels:
    app.kubernetes.io/name: ui-server
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ui-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui-server
        app.kubernetes.io/component: web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ui-server
      # The workload identity webhook projects its own token; the API token is not needed.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui-server
          # USER $APP_UID (1654) in app:Dockerfile; listens on 8080 (ASPNETCORE_HTTP_PORTS default).
          image: <acr-name>.azurecr.io/workorders/ui-server
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Later sources win: Secret values override ConfigMap values with the same key.
          envFrom:
            - configMapRef:
                name: workorders-config
            - secretRef:
                name: workorders-app
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Replaced by /ready once WI-01 delivers it (database-only readiness).
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Let the Gateway and Service endpoints drop this pod before shutdown starts.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # .NET diagnostics and temporary files. Production writes no other files
            # (the local telemetry writer runs in Development only).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui-server
  labels:
    app.kubernetes.io/name: ui-server
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ui-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# One replica today: the budget permits node drains (a rolling surge pod keeps service during a
# deployment, not during a drain). Revisit with WI-09 and two or more replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ui-server
  labels:
    app.kubernetes.io/name: ui-server
    app.kubernetes.io/component: web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui-server
