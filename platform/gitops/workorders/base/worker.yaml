# gitops/workorders/base/worker.yaml
#
# Worker (app:src/Worker): NServiceBus endpoint `WorkOrderProcessing` on the SQL Server
# transport. A competing consumer, so never a Rollout (ADR-C3).
#   - replicas: 0 here and in every overlay until enabled: tdd in phase 2, uat in phase 3,
#     prod only after product-owner sign-off (ADR-D16).
#   - No HTTP endpoint, so no probes until WI-04 adds a liveness signal (§7.9).
#   - Requires RemotableBus__ApiUrl (it calls ui-server in-cluster; allowed by NetworkPolicy
#     ui-server-ingress in network.yaml) and the SQL connection string.
# Image: untagged; the tag comes from envs/<env>/kustomization.yaml (§7.6).
#
# Writer: H (platform owners). Contracts: §7.4, §7.6, §7.8, §7.9, ADR-D16.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: message-handler
  annotations:
    # Federated to id-workorders-{env}-app (§7.8); each config overlay sets the client ID.
    azure.workload.identity/client-id: <uami-client-id>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: message-handler
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: message-handler
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      # Time for in-flight messages to finish before the host stops.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # USER $APP_UID in app:containers/worker/Dockerfile; entrypoint `dotnet Worker.dll`.
          image: <acr-name>.azurecr.io/workorders/worker
          # Explicit so a missing key stops the pod at creation instead of at first message.
          env:
            - name: RemotableBus__ApiUrl
              valueFrom:
                configMapKeyRef:
                  name: workorders-config
                  key: RemotableBus__ApiUrl
          envFrom:
            - configMapRef:
                name: workorders-config
            - secretRef:
                name: workorders-app
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
