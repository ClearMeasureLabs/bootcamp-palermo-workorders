# gitops/workorders/base/secrets.yaml
#
# Application secrets from the environment Key Vault <kv-workorders-{env}> through ESO (§7.8).
# Sync order inside the Application: service account (-3), SecretStore (-2), ExternalSecret (-1),
# workloads (0). Argo CD waits for each wave to be healthy, so pods start only after Secret
# workorders-app exists. No secret value is stored in Git.
#
# Key Vault secret                           -> key in Secret workorders-app
#   workorders-ai-openai-apikey              -> AI_OpenAI_ApiKey
#   workorders-api-validation-key            -> ApiKeyAuthentication__ValidationKey
#   workorders-appinsights-connection-string -> ApplicationInsights__ConnectionString,
#                                               APPLICATIONINSIGHTS_CONNECTION_STRING
#
# Writer: H (platform owners). Contracts: §7.8, §7.9.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workorders-eso
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # Federated to id-workorders-{env}-eso (§7.8); each config overlay sets the client ID.
    # ESO requests the token for this account itself; no pod runs as it.
    azure.workload.identity/client-id: <uami-client-id>
    azure.workload.identity/tenant-id: <AZURE_TENANT_ID>
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      # Each config overlay sets the vault of its environment.
      vaultUrl: https://<kv-workorders-{env}>.vault.azure.net
      serviceAccountRef:
        name: workorders-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workorders-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: workorders-app
    creationPolicy: Owner
  data:
    - secretKey: AI_OpenAI_ApiKey
      remoteRef:
        key: workorders-ai-openai-apikey
    - secretKey: ApiKeyAuthentication__ValidationKey
      remoteRef:
        key: workorders-api-validation-key
    - secretKey: ApplicationInsights__ConnectionString
      remoteRef:
        key: workorders-appinsights-connection-string
    - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      remoteRef:
        key: workorders-appinsights-connection-string
