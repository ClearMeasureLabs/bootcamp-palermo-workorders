# argocd/clusters/nonprod/platform-secrets.yaml
#
# Platform secrets of argocd-nonprod, pulled from <kv-workorders-platform-nonprod> by ESO (§7.8).
# Synced by `platform-root`. The ESO CRDs arrive with addons/external-secrets.yaml, so every
# object here skips the dry run until they exist; the root's retry converges the sync.
#
# Key Vault secrets (written by people or runbooks, never by Git):
#   argocd-repo-read-credential        JSON object with Argo CD repo-creds fields: either
#                                      {"username": "...", "password": "<read-only token>"} or
#                                      {"githubAppID": "...", "githubAppInstallationID": "...",
#                                       "githubAppPrivateKey": "..."} for a GitHub App (R11).
#                                      Never the stored org-wide PAT (§5.1 TB7).
#   argocd-octopus-gateway-token       API token of Argo CD account `octopus` (docs/bootstrap.md)
#   octopus-gateway-registration-token Octopus token for gateway registration (Q13)
#   argocd-sso-client-secret           Only if workload identity federation is unavailable (Q15)
#
# Writer: H (platform owners). Contracts: §7.8, §5.2, ADR-D9, ADR-D14.

# Cluster-wide store, usable only from the two platform namespaces that need it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-keyvault
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - argocd
        - octopus-argocd-gateway
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://<kv-workorders-platform-nonprod>.vault.azure.net
      # Federated to id-eso-platform-nonprod (subject system:serviceaccount:external-secrets:external-secrets).
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
# Argo CD read access to the environment repo. terraform/environment/bootstrap.tf seeds a Secret
# with this name once (no ownerReference); ESO adopts and refreshes it.
# Orphan plus Prune=false: removing this object never cuts Argo CD off from the repo that defines it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-repo-creds
    creationPolicy: Orphan
    template:
      engineVersion: v2
      # Keep the extracted credential fields and add the repo-creds metadata.
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: <ENV_REPO_URL>
  dataFrom:
    - extract:
        key: argocd-repo-read-credential
---
# Gateway -> Argo CD API token (account `octopus`, read-only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-octopus-token
  namespace: octopus-argocd-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-octopus-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argocd-octopus-gateway-token
---
# Gateway -> Octopus registration token (service account svc-argocd-gateway).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: octopus-gateway-registration
  namespace: octopus-argocd-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: octopus-gateway-registration
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: octopus-gateway-registration-token
