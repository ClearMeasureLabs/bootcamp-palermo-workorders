# argocd/clusters/prod/addons/external-secrets.yaml
#
# External Secrets Operator (ADR-D9). Serves two kinds of store:
#   - ClusterSecretStore `platform-keyvault` (argocd/clusters/prod/platform-secrets.yaml),
#     authenticated as this chart's service account, external-secrets/external-secrets, which is
#     federated to UAMI id-eso-platform-prod (§7.8).
#   - Namespaced SecretStore `key-vault` in each app namespace (gitops/workorders/base/secrets.yaml),
#     authenticated as service account workorders-eso in that namespace.
#
# Writer: H (platform owners). Contracts: §7.3 (add-on Applications), §7.8.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-addons
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # external-secrets chart 2.11.0 (appVersion v2.11.0) on the project's main branch,
    # checked 2026-09-24. API external-secrets.io/v1 is required by the manifests in this repo.
    targetRevision: <external-secrets-chart-version>
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          # Fixed name: it is the federated credential subject (§7.8).
          name: external-secrets
          annotations:
            # Client ID of UAMI id-eso-platform-prod (terraform/foundation output).
            azure.workload.identity/client-id: <uami-client-id>
            azure.workload.identity/tenant-id: <AZURE_TENANT_ID>
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The ESO CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
