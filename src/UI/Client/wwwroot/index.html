<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            try {
                var k = 'churchbulletin-theme';
                var v = localStorage.getItem(k);
                var theme = (v === 'dark' || v === 'light') ? v : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) { }
        })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Clear Measure - Bootcamp</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css?v=2024" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=2024" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ClearMeasure.Bootcamp.UI.Client.styles.css?v=2024" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/chat.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
