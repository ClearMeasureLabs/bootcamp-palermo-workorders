# WorkflowTemplate — one AI Dev run per GitHub issue.
# Each Workflow = one isolated pod: init(git clone) + agent + ephemeral SQL sidecar.
# Concurrency across issues is capped to 3 by the ConfigMap in install (parallelism: 3)
# and by the semaphore below.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ai-dev-agent
  namespace: ai-factory
spec:
  serviceAccountName: ai-factory-workflow
  entrypoint: run
  # Hard time budget. The claude agent implements AND runs both quality gates
  # (PrivateBuild + Playwright AcceptanceTests) with a fix loop, plus serve mode,
  # so allow up to 2h.
  activeDeadlineSeconds: 7200
  ttlStrategy:
    secondsAfterCompletion: 86400   # keep finished Workflows 1 day for log review
  podGC:
    strategy: OnWorkflowSuccess     # keep pods on failure for debugging
  # Global 3-at-a-time gate (see semaphore-config.yaml). Redundant with the
  # controller parallelism but makes the cap explicit and per-template.
  synchronization:
    # Argo v3.5 uses the singular `semaphore` object (the plural `semaphores`
    # list form is v3.6+). Keep in sync with the installed controller version.
    semaphore:
      configMapKeyRef:
        name: ai-factory-semaphores
        key: agent-slots
  arguments:
    parameters:
      - { name: issueNumber }
      - { name: issueTitle }
      - { name: issueBody }
      - { name: issueUrl }
      - { name: branchName }
      - { name: repoOrg,        value: "ClearMeasureLabs" }
      - { name: repoName,       value: "bootcamp-palermo-workorders" }
      - { name: aiAgent,        value: "claude" }
      # Model + reasoning effort for the claude agent. Default for simple
      # development: latest Sonnet (claude-sonnet-4-6) at low effort.
      - { name: aiModel,        value: "claude-sonnet-4-6" }
      - { name: aiModelEffort,  value: "low" }
      - { name: runQualityGates, value: "true" }
      # KEEP_ALIVE serve mode: after the PR, run the app + Cloudflare quick tunnel
      # and hold the pod open so the running app can be viewed at a public URL.
      - { name: keepAlive,      value: "false" }
      - { name: servePort,      value: "8080" }
  templates:
    - name: run
      inputs:
        parameters:
          - { name: issueNumber }
          - { name: issueTitle }
          - { name: issueBody }
          - { name: issueUrl }
          - { name: branchName }
          - { name: repoOrg }
          - { name: repoName }
          - { name: aiAgent }
          - { name: aiModel }
          - { name: aiModelEffort }
          - { name: runQualityGates }
          - { name: keepAlive }
          - { name: servePort }
      # Fair-share sizing so 3 fit on one box (was 16 CPU / 24 GB each, sequential).
      podSpecPatch: |
        securityContext:
          # emptyDir volumes (workspace, nuget) and secret files are group-owned
          # by fsGroup, so the non-root user (1001) can read/write them.
          fsGroup: 1001
        containers:
          - name: main
            resources:
              requests: { cpu: "3", memory: "6Gi" }
              limits:   { cpu: "4", memory: "8Gi" }
      metadata:
        labels:
          app: ai-dev
          issue: "{{inputs.parameters.issueNumber}}"
      volumes:
        - name: workspace
          emptyDir: {}
        - name: nuget
          emptyDir: {}
        - name: agent-secrets
          secret:
            secretName: "agent-secret-{{inputs.parameters.issueNumber}}"
            # 0440: owner(root)+group(fsGroup 1001) read. Readable by the non-root
            # user via fsGroup, not world-readable.
            defaultMode: 0440
      # The clone/branch is handled by the container entrypoint (agent-entrypoint.ps1),
      # which does gh auth + git config + clone into the /workspace emptyDir +
      # branch. A separate init clone container is redundant with that and is
      # intentionally omitted.
      # ---- ephemeral DB, pod-local localhost:1433 (per-task isolation) ----
      sidecars:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: "agent-secret-{{inputs.parameters.issueNumber}}", key: sa-password } }
          # sidecar is killed when main exits -> DB never outlives the task
      container:
        name: main
        image: ai-factory-agent:latest
        imagePullPolicy: Never   # image lives in the local shared containerd store
        # Explicit command == the image ENTRYPOINT. Required because the emissary
        # executor otherwise resolves the entrypoint by querying the registry,
        # which fails for a local-only image (no docker.io manifest).
        command: ["pwsh", "/usr/local/bin/agent-entrypoint.ps1"]
        workingDir: /workspace
        env:
          # Downward API: pod name so serve mode can publish the live URL back
          # onto this pod's annotations (see Task 4 in agent-entrypoint.ps1).
          - name: POD_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.name } }
          - name: POD_NAMESPACE
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          - { name: ISSUE_NUMBER,      value: "{{inputs.parameters.issueNumber}}" }
          - { name: ISSUE_TITLE,       value: "{{inputs.parameters.issueTitle}}" }
          - { name: ISSUE_BODY,        value: "{{inputs.parameters.issueBody}}" }
          - { name: ISSUE_URL,         value: "{{inputs.parameters.issueUrl}}" }
          - { name: BRANCH_NAME,       value: "{{inputs.parameters.branchName}}" }
          - { name: REPO_ORG,          value: "{{inputs.parameters.repoOrg}}" }
          - { name: REPO_NAME,         value: "{{inputs.parameters.repoName}}" }
          - { name: AI_AGENT,          value: "{{inputs.parameters.aiAgent}}" }
          - { name: AI_MODEL,          value: "{{inputs.parameters.aiModel}}" }
          - { name: AI_MODEL_EFFORT,   value: "{{inputs.parameters.aiModelEffort}}" }
          - { name: MONITOR_CHECKS,    value: "false" }
          - { name: RUN_QUALITY_GATES, value: "{{inputs.parameters.runQualityGates}}" }
          - { name: ENABLE_DIND,       value: "false" }   # real SQL sidecar => no privileged DinD
          # Integration tests point at the pod-local sidecar.
          - { name: SQL_SERVER,        value: "localhost,1433" }
          # Serve mode: hold the pod open with the app + Cloudflare tunnel.
          - { name: KEEP_ALIVE,        value: "{{inputs.parameters.keepAlive}}" }
          - { name: SERVE_PORT,        value: "{{inputs.parameters.servePort}}" }
        volumeMounts:
          - { name: workspace, mountPath: /workspace }
          - { name: nuget, mountPath: /home/bobagent/.nuget/packages }
          # See init container note: avoid /run/secrets (collides with SA token).
          - { name: agent-secrets, mountPath: /var/agent-secrets, readOnly: true }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
