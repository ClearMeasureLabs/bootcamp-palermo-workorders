ter: k3s-in-WSL / AKS</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="14.5833" lengthAdjust="spacing" textLength="104.1128" x="1599.2752" y="871.0317">(runs the app)</text></g><g class="participant participant-head" data-entity-uid="part8" data-qualified-name="acr" id="part8-head"><rect fill="#E2E2F0" height="48.5352" rx="2.6042" ry="2.6042" style="stroke:#181818;stroke-width:0.5208;" width="150.8392" x="1777.1937" y="113.8021"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="14.5833" lengthAdjust="spacing" textLength="136.2559" x="1784.4854" y="134.6303">Container Registry</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="14.5833" lengthAdjust="spacing" textLength="98.644" x="1803.2913" y="151.6062">(image store)</text></g><g class="participant participant-tail" data-entity-uid="part8" data-qualified-name="acr" id="part8-tail"><rect fill="#E2E2F0" height="48.5352" rx="2.6042" ry="2.6042" style="stroke:#181818;stroke-width:0.5208;" width="150.8392" x="1777.1937" y="833.2275"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="14.5833" lengthAdjust="spacing" textLength="136.2559" x="1784.4854" y="854.0558">Container Registry</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="14.5833" lengthAdjust="spacing" textLength="98.644" x="1803.2913" y="871.0317">(image store)</text></g><g><title>Octopus Deploy</title><rect fill="#FFFFFF" height="551.5869" style="stroke:#181818;stroke-width:1.0417;" width="10.4167" x="417.4998" y="263.9323"/></g><g><title>Argo CD Runtime</title><rect fill="#FFFFFF" height="151.7334" style="stroke:#181818;stroke-width:1.0417;" width="10.4167" x="1208.4513" y="520.3857"/></g><path d="M5.2083,179.0039 L5.2083,236.2956 L1920.8333,236.2956 L1920.8333,189.4206 L1910.4167,179.0039 L5.2083,179.0039" fill="#FFFBEB" style="stroke:#F59E0B;stroke-width:0.5208;"/><path d="M1910.4167,179.0039 L1910.4167,189.4206 L1920.8333,189.4206 L1910.4167,179.0039" fill="#FFFBEB" style="stroke:#F59E0B;stroke-width:0.5208;"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="477.0727" x="720.2718" y="196.7819">Responsibilities: Octopus decides WHEN/WHETHER + runs migrations.</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="405.2846" x="720.2718" y="212.5453">Git is the source of truth. Argo does the actual cluster sync.</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="457.1304" x="720.2718" y="228.3086">Codefresh shows health. Nothing bypasses Git to touch the cluster.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="404.9998,259.7656,415.4165,263.9323,404.9998,268.099,409.1665,263.9323" style="stroke:#181818;stroke-width:1.0417;"/><line style="stroke:#181818;stroke-width:1.0417;" x1="72.4721" x2="411.2498" y1="263.9323" y2="263.9323"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="317.3564" x="79.7638" y="258.6553">1. Create release, approve target environment</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#181818" points="701.3051,290.1123,711.7218,294.279,701.3051,298.4456,705.4718,294.279" style="stroke:#181818;stroke-width:1.0417;"/><line style="stroke:#181818;stroke-width:1.0417;" x1="427.9165" x2="707.5551" y1="294.279" y2="294.279"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="260.8887" x="435.2081" y="289.002">2. Run DbUp migrations (schema first)</text></g><path d="M718.75,307.8206 L718.75,349.4873 L929.1667,349.4873 L929.1667,318.2373 L918.75,307.8206 L718.75,307.8206" fill="#FFFBEB" style="stroke:#F59E0B;stroke-width:0.5208;"/><path d="M918.75,307.8206 L918.75,318.2373 L929.1667,318.2373 L918.75,307.8206" fill="#FFFBEB" style="stroke:#F59E0B;stroke-width:0.5208;"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="189.0742" x="725" y="325.5987">Schema owned by Octopus,</text><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="110.1781" x="725" y="341.362">NOT by Argo CD</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg3"><polygon fill="#181818" points="439.3748,372.819,428.9581,376.9857,439.3748,381.1523,435.2081,376.9857" style="stroke:#181818;stroke-width:1.0417;"/><line style="stroke:#181818;stroke-width:1.0417;stroke-dasharray:2.0833,2.0833;" x1="433.1248" x2="712.7635" y1="376.9857" y2="376.9857"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="126.6556" x="445.6248" y="371.7087">migrations applied</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg4"><polygon fill="#181818" points="853.0574,403.1657,863.474,407.3324,853.0574,411.499,857.224,407.3324" style="stroke:#181818;stroke-width:1.0417;"/><line style="stroke:#181818;stroke-width:1.0417;" x1="427.9165" x2="859.3074" y1="407.3324" y2="407.3324"/><text fill="#000000" font-family="'Segoe UI, Arial, DejaVu Sans, sans-serif'" font-size="13.5417" lengthAdjust="spacing" textLength="347.23" x="435.2081" y="402.0554">3. Commit new image tag into deploy/overlays/dev</text></g><path d="M869.7917,420.874 L869.7917,462.5407 L1103.125,462.5407 L1103.125,431.2907 L1092.7083,420.874 L869.7917,420.874" fill="#FFFBEB" style="stroke:#F59E0B;stroke-width:0.5208;"/><path d="M1092.7083,420.874 L