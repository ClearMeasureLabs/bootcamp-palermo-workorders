version: "1.0"
linter: jetbrains/qodana-cdnet:latest
dotnet:
  solution: src/ChurchBulletin.sln
# Phase 5 (#8846): fail on new/absent problems vs committed baseline.
# Community .NET supports failThreshold only (not severityThresholds).
# Refresh qodana.sarif.json when intentionally remediating baselined findings
# (e.g. #8933 RedundantUsingDirective compile-verified cleanup).
#
# #8986 note: jetbrains/qodana-cdnet does not apply qodana.yaml path excludes
# (verified: even global name-only excludes leave findings). Path scope is
# enforced with file-level `// ReSharper disable <InspectionId>` on the same
# DTO/helper files listed below; this block documents the intentional set.
failThreshold: 0
exclude:
  - name: All
    paths:
      - src/UI/Server/Generated
  # Html.AttributeValueNotResolved: `role="switch"` is valid ARIA 1.1; the HTML
  # inspector does not recognize the value. Keep the role for Settings dark-mode a11y.
  - name: Html.AttributeValueNotResolved
    paths:
      - src/UI.Shared/Pages/Settings.razor
  # ConditionalAccessQualifierIsNonNullableAccordingToAPIContract:
  # HttpContext.RequestServices is annotated non-null, but DefaultHttpContext can leave it
  # unset. Microsoft.Extensions.DependencyInjection.GetService throws on a null provider,
  # so the ?. is required for unit tests and early pipeline safety.
  - name: ConditionalAccessQualifierIsNonNullableAccordingToAPIContract
    paths:
      - src/UI/Server/DetailedHealthCheckResponseWriter.cs
  # UnusedAutoPropertyAccessor.*: getters are consumed by System.Text.Json / health JSON
  # writers via reflection, not by direct C# reads. Public shape is intentional API (#8986).
  - name: UnusedAutoPropertyAccessor.Global
    paths:
      - src/ChurchBulletin.ServiceDefaults/LogEntry.cs
      - src/ChurchBulletin.ServiceDefaults/LogEntryError.cs
      - src/ChurchBulletin.ServiceDefaults/EventEntry.cs
      - src/ChurchBulletin.ServiceDefaults/MetricEntry.cs
      - src/UI/Server/DetailedHealthCheckResponseWriter.cs
  - name: UnusedAutoPropertyAccessor.Local
    paths:
      - src/ChurchBulletin.ServiceDefaults/LogEntry.cs
      - src/ChurchBulletin.ServiceDefaults/LogEntryError.cs
      - src/ChurchBulletin.ServiceDefaults/EventEntry.cs
      - src/ChurchBulletin.ServiceDefaults/MetricEntry.cs
      - src/UI/Server/DetailedHealthCheckResponseWriter.cs
      # Reflection-driven property reads in unit helpers (etag / activity tags).
      - src/UnitTests/Api/ConditionalGetEtagTests.cs
      - src/UnitTests/UI.Shared/UiSharedHelperTests.cs
  # NotAccessedPositionalProperty.*: record/DTO positional members exist for JSON, SignalR,
  # equality, or API contract shapes; in-process code does not always read every slot (#8986).
  - name: NotAccessedPositionalProperty.Global
    paths:
      - src/Core/Model/Events/WorkOrderAssignedToBotEvent.cs
      - src/Core/Model/StateCommands/StateCommandResult.cs
      - src/UI/Api/WorkOrderBulkImportModels.cs
      - src/UI/Server/Notifications/RealtimeNotificationHub.cs
      - src/UI.Shared/Models/UserLoggedInEvent.cs
      - src/UI.Shared/Models/UserLoggedOutEvent.cs
      - src/UI/Server/Middleware/IdempotencyMiddleware.cs
      - src/UI/Server/Middleware/WebServiceMessageValidationMiddleware.cs
      # Build-gate report DTOs: positional slots are serialized / compared, not always read.
      - src/UnitTests/BuildGates/CrapGateEvaluator.cs
  - name: NotAccessedPositionalProperty.Local
    paths:
      - src/Core/Model/Events/WorkOrderAssignedToBotEvent.cs
      - src/Core/Model/StateCommands/StateCommandResult.cs
      - src/UI/Api/WorkOrderBulkImportModels.cs
      - src/UI/Server/Notifications/RealtimeNotificationHub.cs
      - src/UI.Shared/Models/UserLoggedInEvent.cs
      - src/UI.Shared/Models/UserLoggedOutEvent.cs
      - src/UI/Server/Middleware/IdempotencyMiddleware.cs
      - src/UI/Server/Middleware/WebServiceMessageValidationMiddleware.cs
      - src/UnitTests/BuildGates/CrapGateEvaluator.cs
  # Qodana C6 (#9039): MethodHasAsyncOverload — Playwright/NUnit sync APIs are the idiomatic
  # call shape in these two acceptance-test bootstrap files; enforced with file-level
  # `// ReSharper disable` directives (path exclude below is documentation-only, see #8986/C2).
  - name: MethodHasAsyncOverload
    paths:
      - src/AcceptanceTests/AcceptanceTestBase.cs
      - src/AcceptanceTests/BlazorWasmWarmUp.cs
  # Qodana C6 (#9039): UnusedType.Global — these 10 FluentValidation AbstractValidator types are
  # discovered via assembly-scan/DI reflection, not by direct reference. Enforced with file-level
  # `// ReSharper disable once` directives (path exclude below is documentation-only, see #8986/C2).
  # ServerHealthCheckQueryValidator.cs and IntegrationTests/Handlers/TracerBulletReplyHandler.cs are
  # deliberately NOT listed here and stay in the qodana.sarif.json baseline.
  - name: UnusedType.Global
    paths:
      - src/Core/Validation/AssignedToCancelledCommandValidator.cs
      - src/Core/Validation/AssignedToInProgressCommandValidator.cs
      - src/Core/Validation/DraftToAssignedCommandValidator.cs
      - src/Core/Validation/ForecastQueryValidator.cs
      - src/Core/Validation/InProgressToAssignedCommandValidator.cs
      - src/Core/Validation/InProgressToCompleteCommandValidator.cs
      - src/Core/Validation/SaveDraftCommandValidator.cs
      - src/Core/Validation/UserLoggedInEventValidator.cs
      - src/Core/Validation/WorkOrderByNumberQueryValidator.cs
      - src/Core/Validation/WorkOrderSpecificationQueryValidator.cs
  # Qodana C6 (#9039): UnusedMethodReturnValue.Global — fluent IServiceCollection /
  # IHostApplicationBuilder / IApplicationBuilder extension-method pattern; the chained return
  # value is by design and not always used by every call site. Enforced with file-level
  # `// ReSharper disable` directives (path exclude below is documentation-only, see #8986/C2).
  - name: UnusedMethodReturnValue.Global
    paths:
      - src/UI/Server/ApiRateLimitingExtensions.cs
      - src/UI/Server/ApiRequestTimeoutsExtensions.cs
      - src/UI/Server/CorsExtensions.cs
      - src/UI/Server/RequestBodyBufferingExtensions.cs
      - src/ChurchBulletin.ServiceDefaults/Extensions.cs
      - src/ChurchBulletin.ServiceDefaults/CorrelationIdMiddlewareExtensions.cs
      - src/ChurchBulletin.ServiceDefaults/SerilogExtensions.cs
  # Qodana C6 (#9039) / epic #8984 guardrail: ConvertToPrimaryConstructor (25 findings,
  # repo-wide) is left in the qodana.sarif.json baseline BY DESIGN — no mass primary-constructor
  # rewrite. This is a deliberate coding-style choice, not a deferred fix; no path-scoped or
  # file-level exclude is added for it.
