<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Work Orders{% endblock %}</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f4f6f8;color:#17212b}header{background:#153e5c;color:white;padding:1rem 5vw;display:flex;justify-content:space-between;align-items:center}a{color:#126a9b}header a{color:white}main{max-width:1100px;margin:2rem auto;padding:0 1rem}.cards{display:flex;gap:.7rem;flex-wrap:wrap}.card,.panel{background:white;border:1px solid #dae1e7;border-radius:8px;padding:1rem}.card{min-width:100px}.toolbar{display:flex;gap:.6rem;margin:1rem 0;align-items:center}.toolbar label{display:flex;gap:.35rem;align-items:center}input,select,textarea,button{font:inherit;padding:.55rem;border:1px solid #aab8c2;border-radius:4px}button,.button{background:#126a9b;color:white;border:0;padding:.6rem 1rem;border-radius:4px;text-decoration:none;cursor:pointer}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:.8rem;border-bottom:1px solid #e2e7eb}.status{font-weight:600}.muted{color:#5f6d77}.messages{padding:0;list-style:none}.messages li{padding:.75rem;background:#e4f5e9;margin:.5rem 0}.errorlist{color:#a32323}.due-date-today{background:#fef08a}.due-date-overdue{background:#fecaca}.urgency-badge{display:inline-block;margin-left:.5rem;padding:.15rem .45rem;border-radius:999px;font-size:.8rem;font-weight:600}.urgency-badge.due-date-today{background:#fef08a}.urgency-badge.due-date-overdue{background:#fecaca}.urgency-badge.on-track{background:#e2e8f0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.search-page{background:linear-gradient(135deg,#f8fafc,#e2e8f0);min-height:100vh;padding:2rem;margin:-2rem calc((1100px - 100vw)/2)}.search-container{max-width:1200px;margin:auto}.search-header{text-align:center;margin-bottom:2rem}.search-header h1{font:700 2.5rem Georgia,serif;color:#2d3748;margin:0 0 .5rem}.search-subtitle{font-size:1.1rem;color:#718096;font-style:italic}.search-filters-card,.results-card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 10px 30px #0000001a;overflow:hidden}.search-filters-card{padding:2rem;margin-bottom:2rem}.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem;align-items:end}.filter-group{display:flex;flex-direction:column}.filter-label{font-weight:600;color:#4a5568;margin-bottom:.75rem}.form-control{box-sizing:border-box;width:100%;border:2px solid #e2e8f0;border-radius:12px;padding:1rem 1.25rem;background:#f8fafc;color:#2d3748}.check-filter{display:flex;align-items:center;gap:.5rem}.check-filter .filter-label{margin:0}.actions{flex-direction:row;gap:.5rem;align-items:center}.btn-primary{background:linear-gradient(135deg,#7b68ee,#4a90e2);border:0;border-radius:12px;padding:1rem 2rem;font-weight:600;color:white;cursor:pointer;text-decoration:none;white-space:nowrap}.btn-secondary{background:#edf2f7;border-radius:12px;padding:1rem 1.25rem;color:#4a5568;text-decoration:none;white-space:nowrap}.results-header{background:linear-gradient(135deg,#7b68ee,#4a90e2);color:white;padding:1.5rem 2rem;font-size:1.3rem;font-weight:600}.table-scroll{overflow-x:auto}.grid-data{width:100%;border-collapse:collapse;font-size:.95rem}.grid-data thead th{background:linear-gradient(135deg,#f7fafc,#edf2f7);color:#4a5568;padding:1.25rem 1.5rem;text-align:left;border-bottom:2px solid #e2e8f0;font-size:.9rem;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}.grid-data td{padding:1.25rem 1.5rem;vertical-align:middle;color:#2d3748}.grid-data tbody tr{border-bottom:1px solid #f1f5f9}.grid-data tbody tr.odd{background:#fafbfc}.grid-data tbody tr.even{background:white}.sort-btn{background:none;color:#4a5568;text-decoration:none;font:600 .9rem system-ui;text-transform:uppercase;letter-spacing:.5px}.status-badge{background:#e9d8fd;color:#553c9a;padding:.3rem .7rem;border-radius:999px;font-size:.85rem;font-weight:600}.urgency-badge.on-track{background:#bbf7d0;color:#14532d}.empty-results{text-align:center;padding:2rem;color:#718096}.overdue-row{border-left:4px solid #ef4444}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head><body><header><strong>ClearMeasure · Work Orders</strong><nav><a href="{% url 'work_order_list' %}">Dashboard</a>{% if current_employee %}<span> · {{ current_employee.get_full_name|upper }}</span><form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a>{% endif %}</nav></header><main>{% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</main></body></html>
